<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>焰行者 · 三界之门</title>
<style>
  :root{
    --gold:#ffcf5c;
    --flame:#ff7a3d;
    --ink:#07050e;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#05040a;}
  body{
    display:flex;align-items:center;justify-content:center;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    color:#e8e4f5;
    background:radial-gradient(circle at 50% 35%, #1b1035 0%, #06040c 68%);
    -webkit-user-select:none;user-select:none;
  }
  #stage{
    position:relative;width:960px;height:540px;
    transform-origin:center center;
    border-radius:14px;overflow:hidden;
    box-shadow:0 0 0 1px rgba(255,207,92,.16), 0 30px 90px rgba(0,0,0,.85), 0 0 120px rgba(120,60,220,.14);
    background:#05040a;
  }
  canvas#game{display:block;width:960px;height:540px;}

  .screen{
    position:absolute;inset:0;display:none;
    flex-direction:column;align-items:center;justify-content:center;
    padding:24px;
  }
  .screen.on{display:flex;}

  /* ============ 标题页 ============ */
  #screen-title{
    background:
      radial-gradient(ellipse at 50% 78%, rgba(255,122,61,.30) 0%, rgba(255,122,61,0) 55%),
      radial-gradient(ellipse at 50% 30%, rgba(120,70,220,.22) 0%, rgba(0,0,0,0) 60%),
      linear-gradient(180deg, rgba(6,4,14,.86) 0%, rgba(6,4,14,.72) 45%, rgba(6,4,14,.94) 100%);
  }
  .title-wrap{text-align:center;margin-bottom:6px;position:relative;}
  .title-han{
    font-size:78px;font-weight:900;letter-spacing:.16em;
    line-height:1;color:#ffe9c4;
    text-shadow:
      0 0 2px #fff,
      0 0 18px rgba(255,122,61,.95),
      0 0 46px rgba(255,122,61,.55),
      0 8px 0 rgba(120,40,10,.55);
    animation:titleGlow 3.2s ease-in-out infinite;
  }
  @keyframes titleGlow{
    0%,100%{text-shadow:0 0 2px #fff,0 0 18px rgba(255,122,61,.95),0 0 46px rgba(255,122,61,.5),0 8px 0 rgba(120,40,10,.55);}
    50%{text-shadow:0 0 3px #fff,0 0 26px rgba(255,170,90,1),0 0 68px rgba(255,122,61,.8),0 8px 0 rgba(120,40,10,.55);}
  }
  .title-sub{
    margin-top:10px;font-size:15px;letter-spacing:.72em;
    color:#ffb27a;text-indent:.72em;
    text-shadow:0 0 12px rgba(255,122,61,.6);
  }
  .title-line{
    width:340px;height:1px;margin:20px auto 0;
    background:linear-gradient(90deg,transparent,rgba(255,207,92,.7),transparent);
  }
  .title-desc{
    margin-top:16px;font-size:13px;color:#8e86a8;letter-spacing:.12em;line-height:1.9;
  }

  .menu{display:flex;flex-direction:column;gap:11px;margin-top:26px;z-index:3;}
  .btn{
    min-width:230px;padding:11px 30px;border-radius:9px;
    border:1px solid rgba(255,207,92,.36);
    background:linear-gradient(180deg, rgba(255,122,61,.14), rgba(255,122,61,.03));
    color:#ffe0b8;font-size:16px;letter-spacing:.28em;text-indent:.28em;
    font-family:inherit;font-weight:600;cursor:pointer;
    transition:transform .16s ease, background .16s ease, border-color .16s ease, box-shadow .16s ease;
  }
  .btn:hover{
    background:linear-gradient(180deg, rgba(255,122,61,.36), rgba(255,122,61,.10));
    border-color:var(--gold);
    transform:translateY(-2px);
    box-shadow:0 10px 26px rgba(255,122,61,.28);
  }
  .btn:active{transform:translateY(0);}
  .btn.small{min-width:150px;font-size:14px;padding:9px 20px;letter-spacing:.18em;text-indent:.18em;}
  .btn.ghost{border-color:rgba(160,150,200,.3);color:#b9b1d0;background:rgba(255,255,255,.02);}
  .btn.ghost:hover{background:rgba(255,255,255,.07);border-color:rgba(200,190,240,.6);box-shadow:none;}
  .btn:disabled{opacity:.32;cursor:not-allowed;transform:none;box-shadow:none;}

  .tip{
    position:absolute;bottom:16px;width:100%;text-align:center;
    font-size:11.5px;color:#6d6585;letter-spacing:.1em;
  }
  .tip b{color:#a89dc4;font-weight:600;}

  /* ============ 通用面板 ============ */
  .panel{
    width:100%;max-width:820px;
    background:linear-gradient(180deg, rgba(20,14,38,.94), rgba(10,7,20,.96));
    border:1px solid rgba(255,207,92,.20);
    border-radius:14px;
    box-shadow:0 26px 70px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.05);
    padding:26px 30px;
    backdrop-filter:blur(6px);
  }
  .panel-head{
    display:flex;align-items:baseline;gap:14px;
    border-bottom:1px solid rgba(255,207,92,.14);
    padding-bottom:13px;margin-bottom:18px;
  }
  .panel-head h2{
    font-size:21px;letter-spacing:.28em;color:#ffe0b8;font-weight:800;
    text-shadow:0 0 16px rgba(255,122,61,.5);
  }
  .panel-head span{font-size:11.5px;color:#716991;letter-spacing:.2em;}

  /* ============ 人物介绍 ============ */
  #screen-chars{
    background:
      radial-gradient(ellipse at 50% 100%, rgba(255,122,61,.16) 0%, transparent 60%),
      rgba(5,4,11,.93);
  }
  .char-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:14px;
  }
  .char-card{
    display:flex;gap:14px;padding:14px;
    background:linear-gradient(135deg, rgba(255,255,255,.045), rgba(255,255,255,.012));
    border:1px solid rgba(255,255,255,.075);border-radius:11px;
    transition:.2s;cursor:default;
  }
  .char-card:hover{
    border-color:rgba(255,207,92,.5);
    background:linear-gradient(135deg, rgba(255,207,92,.11), rgba(255,255,255,.02));
    transform:translateY(-2px);
    box-shadow:0 12px 30px rgba(0,0,0,.45);
  }
  .char-avatar{
    flex:0 0 62px;height:62px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:28px;
    border:1px solid rgba(255,255,255,.14);
    position:relative;overflow:hidden;
  }
  .char-avatar::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 50% 30%, rgba(255,255,255,.28), transparent 65%);
  }
  .char-info{flex:1;min-width:0;}
  .char-name{
    font-size:15px;font-weight:800;letter-spacing:.06em;
    display:flex;align-items:center;gap:8px;
  }
  .char-role{
    font-size:10px;padding:1px 7px;border-radius:20px;font-weight:600;
    letter-spacing:.12em;border:1px solid currentColor;opacity:.9;
  }
  .char-desc{
    margin-top:6px;font-size:11.5px;line-height:1.75;color:#9a93b3;
  }
  .char-stat{
    margin-top:6px;font-size:10.5px;color:#7d769a;letter-spacing:.06em;
  }
  .char-stat b{color:#ffcf5c;font-weight:700;}
  .char-skill{
    margin-top:8px;padding:6px 9px;border-radius:7px;
    font-size:10.5px;line-height:1.7;color:#c9c1e0;
    background:rgba(255,255,255,.045);
    border-left:2px solid rgba(255,207,92,.55);
  }
  .char-skill .sk-name{color:#ffcf5c;font-weight:700;letter-spacing:.04em;}
  .char-skill .sk-key{
    display:inline-block;margin-left:6px;padding:0 5px;border-radius:4px;
    font-size:9.5px;color:#0b0813;background:#ffcf5c;font-weight:800;
    letter-spacing:.06em;
  }

  /* ============ 关卡选择 ============ */
  #screen-levels{
    background:
      radial-gradient(ellipse at 50% 0%, rgba(120,70,220,.18), transparent 65%),
      rgba(5,4,11,.93);
  }
  .lv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .lv-card{
    position:relative;padding:16px 14px;border-radius:11px;cursor:pointer;
    background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.012));
    border:1px solid rgba(255,255,255,.08);
    transition:.2s;text-align:center;overflow:hidden;
  }
  .lv-card.locked{opacity:.4;cursor:not-allowed;filter:grayscale(.8);}
  .lv-card:not(.locked):hover{
    transform:translateY(-4px);
    border-color:rgba(255,207,92,.6);
    box-shadow:0 16px 34px rgba(0,0,0,.55), 0 0 0 1px rgba(255,207,92,.16) inset;
  }
  .lv-no{
    font-size:26px;font-weight:900;color:rgba(255,207,92,.85);
    letter-spacing:.06em;line-height:1;
    text-shadow:0 0 20px rgba(255,122,61,.5);
  }
  .lv-name{margin-top:8px;font-size:13px;font-weight:700;color:#e9e2ff;letter-spacing:.04em;}
  .lv-sub{margin-top:5px;font-size:10.5px;color:#7d769a;line-height:1.6;}
  .lv-badge{
    margin-top:10px;font-size:10px;letter-spacing:.14em;
    color:#ffcf5c;opacity:.85;
  }
  .lv-card.locked .lv-badge{color:#6d6585;}

  /* ============ 对话 ============ */
  #screen-dialog{
    justify-content:flex-end;padding:0;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(120,70,220,.20), transparent 60%),
      linear-gradient(180deg, rgba(5,4,11,.55) 0%, rgba(5,4,11,.90) 100%);
    cursor:pointer;
  }
  .dlg-scene{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-size:150px;opacity:.16;
    filter:blur(1px);
  }
  .dlg-box{
    position:relative;width:100%;
    background:linear-gradient(180deg, rgba(16,11,30,.96), rgba(8,6,16,.99));
    border-top:1px solid rgba(255,207,92,.28);
    padding:20px 40px 24px;
    min-height:158px;
    box-shadow:0 -18px 50px rgba(0,0,0,.7);
  }
  .dlg-name{
    display:inline-block;margin-top:-38px;margin-bottom:10px;
    padding:6px 20px;border-radius:8px;
    font-size:14px;font-weight:800;letter-spacing:.2em;
    background:linear-gradient(180deg, rgba(255,122,61,.9), rgba(180,60,20,.9));
    color:#fff6e6;
    box-shadow:0 6px 18px rgba(255,100,40,.35), inset 0 1px 0 rgba(255,255,255,.3);
  }
  .dlg-text{
    font-size:15.5px;line-height:2;color:#dcd5ee;
    min-height:64px;letter-spacing:.04em;
    text-shadow:0 1px 2px rgba(0,0,0,.5);
  }
  .dlg-hint{
    position:absolute;right:40px;bottom:16px;
    font-size:11px;color:#ffcf5c;letter-spacing:.16em;
    animation:blink 1.1s steps(2,end) infinite;
  }
  @keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:.15}}

  /* ============ 结果 / 暂停 ============ */
  .center-box{text-align:center;}
  .res-title{
    font-size:34px;font-weight:900;letter-spacing:.24em;
    color:#ffe9c4;text-indent:.24em;
    text-shadow:0 0 26px rgba(255,122,61,.8);
  }
  .res-title.lose{color:#ff8f8f;text-shadow:0 0 26px rgba(255,60,60,.7);}
  .res-sub{margin-top:10px;font-size:12.5px;color:#8e86a8;letter-spacing:.2em;}
  .res-stats{
    display:flex;gap:12px;justify-content:center;margin:26px 0 8px;
  }
  .res-item{
    min-width:104px;padding:12px 10px;border-radius:10px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
  }
  .res-item .k{font-size:10.5px;color:#8a83a6;letter-spacing:.14em;}
  .res-item .v{
    margin-top:6px;font-size:22px;font-weight:900;color:#ffcf5c;
    font-variant-numeric:tabular-nums;
  }
  .res-actions{display:flex;gap:12px;justify-content:center;margin-top:26px;}

  /* 触屏 */
  #touch{position:absolute;inset:0;display:none;pointer-events:none;z-index:5;}
  #touch.on{display:block;}
  .tbtn{
    position:absolute;bottom:26px;width:70px;height:70px;border-radius:50%;
    background:rgba(255,255,255,.10);
    border:1.5px solid rgba(255,207,92,.45);
    display:flex;align-items:center;justify-content:center;
    color:#ffcf5c;font-size:24px;font-weight:700;
    pointer-events:auto;backdrop-filter:blur(3px);
  }
  .tbtn:active{background:rgba(255,207,92,.35);}
  #t-left{left:26px;}
  #t-right{left:110px;}
  #t-jump{right:110px;bottom:44px;}
  #t-atk{right:26px;bottom:20px;width:80px;height:80px;font-size:20px;}
  #t-skill{right:200px;bottom:34px;width:62px;height:62px;font-size:18px;border-color:rgba(127,230,255,.6);color:#7fe6ff;}

  .mute-btn{
    position:absolute;top:12px;right:14px;z-index:20;
    width:32px;height:32px;border-radius:8px;
    background:rgba(10,8,18,.6);border:1px solid rgba(255,255,255,.13);
    color:#c9c1e0;font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .mute-btn:hover{border-color:var(--gold);color:#ffcf5c;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="960" height="540"></canvas>

  <!-- 标题 -->
  <div class="screen on" id="screen-title">
    <div class="title-wrap">
      <div class="title-han">焰行者</div>
      <div class="title-sub">三界之门</div>
      <div class="title-line"></div>
      <div class="title-desc">当最后一点火种熄灭之时，世界便只剩下影子。</div>
    </div>
    <div class="menu">
      <button class="btn" id="btn-start">开 始 冒 险</button>
      <button class="btn" id="btn-continue">继 续 征 程</button>
      <button class="btn ghost" id="btn-chars">人 物 志</button>
      <button class="btn ghost" id="btn-levels">关 卡 选 择</button>
    </div>
    <div class="tip">操作 &nbsp; <b>A / D</b> 移动 &nbsp;·&nbsp; <b>空格 / W</b> 跳跃 &nbsp;·&nbsp; <b>J</b> 挥剑 &nbsp;·&nbsp; <b>K / L / U</b> 技能 &nbsp;·&nbsp; <b>ESC</b> 暂停</div>
  </div>

  <!-- 人物志 -->
  <div class="screen" id="screen-chars">
    <div class="panel">
      <div class="panel-head">
        <h2>人 物 志</h2>
        <span>CHARACTERS</span>
      </div>
      <div class="char-grid" id="char-grid"></div>
      <div style="display:flex;justify-content:center;margin-top:20px;">
        <button class="btn small ghost" id="btn-chars-back">返 回</button>
      </div>
    </div>
  </div>

  <!-- 关卡选择 -->
  <div class="screen" id="screen-levels">
    <div class="panel">
      <div class="panel-head">
        <h2>关 卡 选 择</h2>
        <span>CHAPTERS</span>
      </div>
      <div class="lv-grid" id="lv-grid"></div>
      <div style="display:flex;justify-content:center;margin-top:20px;">
        <button class="btn small ghost" id="btn-levels-back">返 回</button>
      </div>
    </div>
  </div>

  <!-- 剧情对话 -->
  <div class="screen" id="screen-dialog">
    <div class="dlg-scene" id="dlg-scene">✦</div>
    <div class="dlg-box">
      <div class="dlg-name" id="dlg-name">???</div>
      <div class="dlg-text" id="dlg-text"></div>
      <div class="dlg-hint" id="dlg-hint">点击继续 ▸</div>
    </div>
  </div>

  <!-- 结算 -->
  <div class="screen" id="screen-result">
    <div class="center-box" style="width:100%">
      <div class="panel" style="max-width:520px;margin:0 auto;">
        <div class="res-title" id="res-title">关卡通过</div>
        <div class="res-sub" id="res-sub">CHAPTER CLEAR</div>
        <div class="res-stats" id="res-stats"></div>
        <div class="res-actions" id="res-actions"></div>
      </div>
    </div>
  </div>

  <!-- 暂停 -->
  <div class="screen" id="screen-pause">
    <div class="panel" style="max-width:380px;">
      <div class="center-box">
        <div class="res-title" style="font-size:26px;">暂 停</div>
        <div class="res-sub" style="margin-top:14px;">PAUSED</div>
        <div class="res-actions" style="flex-direction:column;align-items:stretch;margin-top:24px;">
          <button class="btn small" id="btn-resume">继 续 游 戏</button>
          <button class="btn small ghost" id="btn-restart">重 新 开 始 本 关</button>
          <button class="btn small ghost" id="btn-quit">返 回 标 题</button>
        </div>
      </div>
    </div>
  </div>

  <button class="mute-btn" id="mute-btn" title="音效开关">♪</button>

  <div id="touch">
    <div class="tbtn" id="t-left">◀</div>
    <div class="tbtn" id="t-right">▶</div>
    <div class="tbtn" id="t-jump">跳</div>
    <div class="tbtn" id="t-atk">斩</div>
    <div class="tbtn" id="t-skill">术</div>
  </div>
</div>

<script>
/* ================= 基础常量 ================= */
const W = 960, H = 540;
const GRAVITY = 0.62, MAX_FALL = 17;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const stageEl = document.getElementById('stage');

/* ================= 人物设定 ================= */
const CHARACTERS = [
  {
    name: '阿炎', role: '主角 · 焰行者',
    color: '#ff8a4c', emoji: '🔥',
    desc: '余烬村最后的守火人。三界之门崩塌那夜，他把最后一簇火种咽进了身体，从此胸口会发烫，也会疼。',
    stat: '武器 · 余烬之刃 &nbsp;|&nbsp; 特性 · 二段跳',
    skill: { name: '余烬三式', key: 'K / L / U', text: '炎舞斩 · 焰步闪 · 焚天归火。三式随章节逐层开悟。' }
  },
  {
    name: '小灯', role: '同伴 · 萤火精灵',
    color: '#ffd166', emoji: '✦',
    desc: '一盏会说话的灯。记性很差，却记得所有关于"门"的传说。总在阿炎快要放弃的时候，轻轻亮一下。',
    stat: '职能 · 引路 / 提示 &nbsp;|&nbsp; 特性 · 不会被黑暗吞噬',
    skill: { name: '萤火引路', key: '被动', text: '在你胸口留一粒萤光，灵力回复更快，黑暗中也能看见脚下的路。' }
  },
  {
    name: '蚀', role: '反派 · 影之王',
    color: '#a855f7', emoji: '🌑',
    desc: '他曾是第一个守火人。在无尽的长夜里，他发现自己可以吞下黑暗来活下去——于是再也没停下。',
    stat: '威胁 · 极 &nbsp;|&nbsp; 弱点 · 尚未被发现',
    skill: { name: '影噬', key: 'BOSS', text: '吞噬光线、吐出影弹，血量低于四成后进入暴怒，速度暴涨。' }
  },
  {
    name: '烬', role: '旁支 · 铁匠之女',
    color: '#7be08a', emoji: '⚒',
    desc: '村子烧起来那天，她背着半袋矿石跑了出来。她在每个关口的尽头留下了补给与一句话：别死。',
    stat: '职能 · 关卡商人 &nbsp;|&nbsp; 状态 · 下落不明',
    skill: { name: '熔铸', key: '商店', text: '在关卡尽头替你重铸刀刃——每通过一章，你的技能就多一式。' }
  }
];

/* ================= 技能配置 ================= */
// unlock：需要通关到第几章才习得（对应存档里的 progress）
const SKILLS = [
  {
    name: '炎舞斩', glyph: '斩', key: 'K', code: 'KeyK',
    cost: 22, cd: 45, unlock: 0, color: '#ff8a4c',
    desc: '横斩出一道火焰剑气，穿透沿途所有敌人'
  },
  {
    name: '焰步闪', glyph: '闪', key: 'L', code: 'KeyL',
    cost: 20, cd: 70, unlock: 1, color: '#5ad2f4',
    desc: '化火前冲，全程无敌，擦身而过的敌人会被点燃'
  },
  {
    name: '焚天 · 归火', glyph: '焚', key: 'U', code: 'KeyU',
    cost: 60, cd: 300, unlock: 2, color: '#ffcf5c',
    desc: '引爆体内火种：灼烧全场敌人、清空弹幕、回一点血'
  }
];
const SP_MAX = 100;


/* ================= 敌人模板 ================= */
const ENEMY_TYPES = {
  slime: { w: 38, h: 28, hp: 2, speed: 1.05, dmg: 1, color: '#7be08a', glow: '#c9ffb0', patrol: 130 },
  bat:   { w: 36, h: 26, hp: 2, speed: 1.75, dmg: 1, color: '#a78bfa', glow: '#e0d0ff', fly: true },
  wraith:{ w: 40, h: 44, hp: 3, speed: 1.5,  dmg: 1, color: '#f06292', glow: '#ffc0d8', fly: true },

let audioCtx = null, muted = false, masterGain = null;
function ac(){
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.55;
      masterGain.connect(audioCtx.destination);
    } catch (e) { audioCtx = null; }
  }
  return audioCtx;
}
function beep(freq, dur, type, vol) {
  if (muted) return;
  const c = ac(); if (!c) return;
  try {
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, c.currentTime);
    g.gain.setValueAtTime(vol || 0.06, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g); g.connect(masterGain);
    o.start(); o.stop(c.currentTime + dur + 0.02);
  } catch (e) {}
}
function sfx(name) {
  switch (name) {
    case 'jump':  beep(420, 0.10, 'square', 0.05); setTimeout(() => beep(620, 0.09, 'square', 0.04), 40); break;
    case 'djump': beep(560, 0.09, 'square', 0.05); setTimeout(() => beep(820, 0.10, 'square', 0.04), 40); break;
    case 'slash': beep(900, 0.06, 'sawtooth', 0.035); break;
    case 'hit':   beep(180, 0.09, 'square', 0.07); setTimeout(() => beep(110, 0.10, 'square', 0.05), 30); break;
    case 'coin':  beep(1180, 0.07, 'triangle', 0.06); setTimeout(() => beep(1580, 0.09, 'triangle', 0.05), 55); break;
    case 'hurt':  beep(220, 0.16, 'sawtooth', 0.09); setTimeout(() => beep(130, 0.20, 'sawtooth', 0.07), 70); break;
    case 'die':   beep(300, 0.20, 'sawtooth', 0.09); setTimeout(() => beep(160, 0.34, 'sawtooth', 0.08), 150); break;
    case 'clear': [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.16, 'triangle', 0.06), i * 95)); break;
    case 'ui':    beep(680, 0.05, 'triangle', 0.04); break;
    case 'boss':  beep(90, 0.5, 'sawtooth', 0.09); break;
    case 'skill': beep(760, 0.07, 'sawtooth', 0.05); setTimeout(() => beep(1080, 0.12, 'sawtooth', 0.045), 45); break;
    case 'dash':  beep(1300, 0.05, 'triangle', 0.04); setTimeout(() => beep(520, 0.10, 'triangle', 0.04), 35); break;
    case 'nova':  [220, 330, 440, 660, 880].forEach((f, i) => setTimeout(() => beep(f, 0.28, 'sawtooth', 0.07), i * 55)); break;

  }
}

function setKey(code, down) {
  const k = KEYMAP[code];
  if (!k) return false;
  if (down && !keys[k]) pressed[k] = true;
  keys[k] = down;
  return true;
}

});

/* ================= 工具 ================= */
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const rand = (a, b) => a + Math.random() * (b - a);

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function rect(x, y, w, h, r) {
  r = r || 0;
  ctx.beginPath();
  if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); }
  else {
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  }
  ctx.closePath();
}
function glowDot(x, y, r, color) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}

/* ================= 玩家物理 ================= */
function moveWithCollision(ent, allowOneWay) {
  let hitWall = false;
  ent.x += ent.vx;
  for (const p of level.platforms) {
    if (overlap(ent, p)) {
      if (ent.vx > 0) { ent.x = p.x - ent.w; ent.vx = 0; hitWall = true; }
      else if (ent.vx < 0) { ent.x = p.x + p.w; ent.vx = 0; hitWall = true; }
    }
  }
  if (ent.x < 0) { ent.x = 0; ent.vx = 0; }
  if (ent.x + ent.w > level.width) { ent.x = level.width - ent.w; ent.vx = 0; }

  const prevBottom = ent.y + ent.h;
  ent.y += ent.vy;
  ent.onGround = false;
  for (const p of level.platforms) {
    if (!overlap(ent, p)) continue;
    if (ent.vy >= 0 && prevBottom <= p.y + 8) {
      ent.y = p.y - ent.h; ent.vy = 0; ent.onGround = true;
    } else if (ent.vy < 0) {
      ent.y = p.y + p.h; ent.vy = 0;
    }
  }
  return hitWall;
}

function playerAttackBox() {
  const p = player;
  return p.facing > 0
    ? { x: p.x + p.w - 8, y: p.y + 4, w: 46, h: 34 }
    : { x: p.x - 38, y: p.y + 4, w: 46, h: 34 };
}

/* ================= 技能 ================= */
function skillUnlocked(i) {
  return saveData.progress >= SKILLS[i].unlock;
}

function castSkill(i) {
  const p = player, s = SKILLS[i];
  if (!p || state !== 'playing') return;
  if (!skillUnlocked(i)) {
    sfx('deny');
    floaters.push({ x: p.x + p.w / 2, y: p.y - 14, text: '尚未习得', color: '#8a83a6', t: 46, vy: -0.8 });
    return;
  }
  if (p.skCd[i] > 0) { sfx('deny'); return; }
  if (p.sp < s.cost) {
    sfx('deny');
    floaters.push({ x: p.x + p.w / 2, y: p.y - 14, text: '灵力不足', color: '#7fe6ff', t: 46, vy: -0.8 });
    return;
  }

  p.sp -= s.cost;
  p.skCd[i] = s.cd;

  if (i === 0) {
    /* 炎舞斩：向前甩出一道穿透剑气 */
    p.atkTimer = 0;
    pShots.push({
      x: p.x + p.w / 2 + p.facing * 16, y: p.y + p.h / 2 - 4,
      vx: p.facing * 12.5, vy: 0, r: 22, dmg: 2, life: 62,
      hits: new Set(), color: s.color, dir: p.facing, t: 0
    });
    burst(p.x + p.w / 2 + p.facing * 18, p.y + p.h / 2 - 4, s.color, 10);
    shake = Math.max(shake, 5);
    sfx('skill');

  } else if (i === 1) {
    /* 焰步闪：无敌冲刺 */
    p.dashT = 14;
    p.dashDir = p.facing;
    p.dashHits = new Set();
    p.stun = 0;
    p.iFrames = Math.max(p.iFrames, 26);
    p.vy = 0;
    shake = Math.max(shake, 4);
    sfx('dash');

  } else {
    /* 焚天 · 归火：全屏灼烧 + 清弹幕 + 回血 */
    p.novaT = 64;
    p.iFrames = Math.max(p.iFrames, 76);
    p.stun = 0;
    p.vx = 0;
    bullets.length = 0;
    shake = 26; hitStop = 6;
    sfx('nova');
    for (const e of enemies) {
      if (!e.alive) continue;
      // noSp=true：大招自身不再回灵力，避免一发自给自足
      hitEnemy(e, 6, e.x + e.w / 2 < p.x + p.w / 2 ? -1 : 1, true);
    }
    if (p.hp < p.maxHp) {
      p.hp++;
      floaters.push({ x: p.x + p.w / 2, y: p.y - 12, text: '+1 ♥', color: '#ff8a8a', t: 60, vy: -0.9 });
    }
    for (let k = 0; k < 26; k++) {
      const a = (k / 26) * Math.PI * 2;
      particles.push({
        x: p.x + p.w / 2 + Math.cos(a) * 30, y: p.y + p.h / 2 + Math.sin(a) * 22,
        vx: Math.cos(a) * 6, vy: Math.sin(a) * 4 - 1,
        life: 46, max: 46, color: k % 2 ? '#ffcf5c' : '#ff7a3d', size: rand(2.5, 5), grav: 0.02
      });
    }
  }
}

function damagePlayer(amount, fromX) {
  const p = player;
  if (p.iFrames > 0 || state !== 'playing') return;
  p.hp -= amount;
  p.iFrames = 84;
  p.stun = 14;
  const dir = (fromX !== undefined && fromX < p.x + p.w / 2) ? 1 : -1;
  p.vx = dir * 6.5;
  p.vy = -6.5;
  shake = 12;
  hitStop = 5;
  sfx('hurt');
  burst(p.x + p.w / 2, p.y + p.h / 2, '#ff5a5a', 10);
  floaters.push({ x: p.x + p.w / 2, y: p.y - 6, text: '-' + amount, color: '#ff7b7b', t: 50, vy: -1 });
  if (p.hp <= 0) {
    p.hp = 0;
    sfx('die');
    state = 'dying';
    setTimeout(() => { if (state === 'dying') showGameOver(); }, 700);
  }
}

/* ================= 特效 ================= */
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = rand(1, 5);
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
      life: rand(22, 44), max: 44, color, size: rand(2, 4.5), grav: 0.12
    });
  }
}
function spark(x, y, color) {
  for (let i = 0; i < 5; i++) {
    const a = rand(-1.2, 1.2), sp = rand(2, 5);
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 14, max: 14, color, size: rand(1.5, 3), grav: 0.05
    });
  }
}

/* ================= 更新 ================= */
function update() {
  frame++;
  if (state !== 'playing') {
    updateParticles();
    if (clearFlash > 0) clearFlash--;
    if (shake > 0) shake *= 0.9;
    return;
  }

  if (hitStop > 0) { hitStop--; return; }
  levelFrames++;

  // 消费本帧按键，避免同帧多次物理步进导致重复触发
  const inpJump = !!pressed.jump; pressed.jump = false;
  const inpAttack = !!pressed.attack; pressed.attack = false;
  const inpS1 = !!pressed.skill1; pressed.skill1 = false;
  const inpS2 = !!pressed.skill2; pressed.skill2 = false;
  const inpS3 = !!pressed.skill3; pressed.skill3 = false;

  const p = player;
  p.animTime++;
  if (p.iFrames > 0) p.iFrames--;
  if (p.stun > 0) p.stun--;
  if (p.atkCd > 0) p.atkCd--;
  if (p.atkTimer > 0) p.atkTimer--;
  if (shake > 0) shake *= 0.88;
  if (clearFlash > 0) clearFlash--;

  /* --- 技能：冷却与灵力 --- */
  for (let i = 0; i < p.skCd.length; i++) if (p.skCd[i] > 0) p.skCd[i]--;
  if (p.sp < p.spMax) p.sp = Math.min(p.spMax, p.sp + 0.30);
  if (p.novaT > 0) p.novaT--;

  if (inpS1) castSkill(0);
  if (inpS2) castSkill(1);
  if (inpS3) castSkill(2);
  // 技能可能把血打空/直接结束关卡，重新确认状态
  if (state !== 'playing') { updateParticles(); return; }

  /* --- 水平移动 --- */
  const moveSpeed = 4.0, accel = 0.9;
  if (p.dashT > 0) {
    /* 焰步闪：冲刺期间锁定水平速度、无视重力 */
    p.dashT--;
    p.vx = p.dashDir * 13.5;
    p.vy = 0;
    p.iFrames = Math.max(p.iFrames, 2);
    if (p.dashT % 2 === 0) {
      particles.push({
        x: p.x + p.w / 2 - p.dashDir * 8, y: p.y + p.h / 2 + rand(-10, 10),
        vx: -p.dashDir * rand(1, 3), vy: rand(-1, 1),
        life: 20, max: 20, color: '#7fe6ff', size: rand(2, 4), grav: -0.02
      });
    }
  } else if (p.stun <= 0) {
    if (keys.left) { p.vx -= accel; p.facing = -1; }
    else if (keys.right) { p.vx += accel; p.facing = 1; }
    else { p.vx *= p.onGround ? 0.72 : 0.9; if (Math.abs(p.vx) < 0.12) p.vx = 0; }
    p.vx = clamp(p.vx, -moveSpeed, moveSpeed);
  } else {
    p.vx *= 0.93;
  }

  /* --- 跳跃 --- */
  // 落地重置：土狼时间 8 帧，离开平台边缘后短时间内仍可起跳
  if (p.onGround) { p.jumps = 0; p.coyote = 8; }
  else if (p.coyote > 0) p.coyote--;

  // 跳跃预输入缓冲 10 帧：落地前按下的跳会被记住，落地瞬间自动起跳
  if (inpJump) p.buffer = 10;
  if (p.buffer > 0) {
    if (p.onGround || p.coyote > 0) {
      p.vy = -12.8; p.jumps = 1; p.buffer = 0; p.coyote = 0; p.onGround = false;
      sfx('jump'); spark(p.x + p.w / 2, p.y + p.h, '#ffcf5c');
    } else if (p.jumps < 2) {
      p.vy = -11.2; p.jumps = 2; p.buffer = 0;
      sfx('djump');
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        particles.push({ x: p.x + p.w / 2, y: p.y + p.h, vx: Math.cos(a) * 2.4, vy: Math.sin(a) * 1.2 + 1, life: 20, max: 20, color: '#ffb26b', size: 3, grav: 0.04 });
      }
    }
    p.buffer--;
  }
  // 可变跳跃高度：松手截断上升，但保底 -8，轻点一下也能跳过矮台阶
  if (!keys.jump && p.vy < -8) p.vy = Math.max(p.vy * 0.88, -8);

  /* --- 重力 --- */
  if (p.dashT > 0) p.vy = 0;
  else p.vy = Math.min(p.vy + GRAVITY, MAX_FALL);
  moveWithCollision(p);

  /* --- 焰步闪：冲刺途中撞到的敌人 --- */
  if (p.dashT > 0) {
    const dashBox = { x: p.x - 10, y: p.y - 4, w: p.w + 20, h: p.h + 8 };
    for (const e of enemies) {
      if (!e.alive || p.dashHits.has(e)) continue;
      if (overlap(dashBox, e)) {
        p.dashHits.add(e);
        hitEnemy(e, 2, p.dashDir);
      }
    }
    if (state !== 'playing') return;
  }

  /* --- 攻击 --- */
  if (inpAttack && p.atkCd <= 0) {
    p.atkTimer = 12; p.atkCd = 24; p.hitSet.clear();
    sfx('slash');
  }

  /* --- 攻击判定 --- */
  if (p.atkTimer > 6) {
    const box = playerAttackBox();
    for (const e of enemies) {
      if (!e.alive || p.hitSet.has(e)) continue;
      if (overlap(box, e)) {
        p.hitSet.add(e);
        hitEnemy(e, 1, p.facing);
      }
    }
  }

  /* --- 记录复活点 --- */
  if (p.onGround && p.y < 500 && levelFrames % 20 === 0) {
    let safe = true;
    for (const hz of level.hazards) {
      if (Math.abs(hz.x - p.x) < 130) { safe = false; break; }
    }
    if (safe) p.respawn = { x: p.x, y: p.y };
  }

  /* --- 掉出画面 --- */
  if (p.y > H + 80) {
    if (p.iFrames <= 0) {
      p.hp -= 1; p.iFrames = 90; shake = 14; sfx('hurt');
      if (p.hp <= 0) { p.hp = 0; state = 'dying'; setTimeout(() => { if (state === 'dying') showGameOver(); }, 600); return; }
    }
    p.x = p.respawn.x; p.y = p.respawn.y - 10; p.vx = 0; p.vy = 0;
    burst(p.x + 15, p.y + 20, '#ff5a5a', 8);
  }

  /* --- 危险区域 --- */
  for (const hz of level.hazards) {
    if (overlap(p, hz) && p.iFrames <= 0) {
      damagePlayer(1, hz.x + hz.w / 2);
      if (state !== 'playing') return;
      p.x = p.respawn.x; p.y = p.respawn.y - 10; p.vx = 0; p.vy = 0;
      break;
    }
  }

  /* --- 星火 --- */
  for (const s of starList) {
    if (s.got) continue;
    s.t += 0.08;
    if (Math.abs(s.x - (p.x + p.w / 2)) < 24 && Math.abs(s.y - (p.y + p.h / 2)) < 28) {
      s.got = true; starsCollected++;
      p.sp = Math.min(p.spMax, p.sp + 14);      // 星火补充灵力
      sfx('coin');
      burst(s.x, s.y, '#ffcf5c', 8);
      floaters.push({ x: s.x, y: s.y, text: '+1', color: '#ffcf5c', t: 44, vy: -1.1 });
      if (p.sp >= p.spMax) floaters.push({ x: s.x, y: s.y - 16, text: '灵力满', color: '#7fe6ff', t: 44, vy: -1.1 });
    }
  }

  /* --- 敌人 --- */
  updateEnemies();

  /* --- 弹丸 --- */
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;
    if (b.life <= 0) { bullets.splice(i, 1); continue; }
    if (b.trail) b.trail.push({ x: b.x, y: b.y });
    if (b.trail && b.trail.length > 6) b.trail.shift();
    if (overlap({ x: b.x - b.r, y: b.y - b.r, w: b.r * 2, h: b.r * 2 }, p)) {
      damagePlayer(b.dmg || 1, b.x);
      bullets.splice(i, 1);
      continue;
    }
    // 碰平台消失
    let hitP = false;
    for (const pl of level.platforms) {
      if (b.x > pl.x && b.x < pl.x + pl.w && b.y > pl.y && b.y < pl.y + pl.h) { hitP = true; break; }
    }
    if (hitP) { burst(b.x, b.y, b.color, 4); bullets.splice(i, 1); }
  }

  /* --- 玩家技能弹道（炎舞斩） --- */
  for (let i = pShots.length - 1; i >= 0; i--) {
    const b = pShots[i];
    b.x += b.vx; b.y += b.vy; b.life--; b.t++;
    if (b.life <= 0) { pShots.splice(i, 1); continue; }

    // 拖尾火星
    if (b.t % 2 === 0) {
      particles.push({
        x: b.x - b.dir * 10, y: b.y + rand(-14, 14),
        vx: -b.dir * rand(0.5, 2), vy: rand(-0.8, 0.8),
        life: 16, max: 16, color: b.color, size: rand(1.6, 3.4), grav: -0.01
      });
    }

    // 命中敌人（同一道剑气对同一目标只结算一次）
    for (const e of enemies) {
      if (!e.alive || b.hits.has(e)) continue;
      if (overlap({ x: b.x - b.r * 0.6, y: b.y - b.r, w: b.r * 1.2, h: b.r * 2 }, e)) {
        b.hits.add(e);
        hitEnemy(e, b.dmg, b.dir);
        spark(e.x + e.w / 2, e.y + e.h / 2, '#ffd08a');
      }
    }
    if (state !== 'playing') return;

    // 撞墙消散
    let hitWall2 = false;
    for (const pl of level.platforms) {
      if (b.x > pl.x && b.x < pl.x + pl.w && b.y > pl.y && b.y < pl.y + pl.h) { hitWall2 = true; break; }
    }
    if (hitWall2) { burst(b.x, b.y, b.color, 10); pShots.splice(i, 1); }
  }

  updateParticles();

  /* --- 终点 --- */
  if (level.goal && state === 'playing') {
    const g = level.goal;
    if (overlap(p, { x: g.x + 6, y: g.y, w: g.w - 12, h: g.h })) {
      clearLevel();
    }
  }

  /* --- 摄像机 --- */
  cam.targetX = clamp(p.x + p.w / 2 - W / 2, 0, Math.max(0, level.width - W));
  cam.x += (cam.targetX - cam.x) * 0.12;
}

function hitEnemy(e, dmg, dir, noSp) {
  e.hp -= dmg;
  e.flash = 12;
  e.vx = dir * 5;
  hitStop = 4;
  shake = 7;
  sfx('hit');
  spark(e.x + e.w / 2, e.y + e.h / 2, '#fff3c4');
  // 命中回灵力：鼓励贴身战斗，而不是站在远处等冷却
  if (player && !noSp) player.sp = Math.min(player.spMax, player.sp + 5);
  if (e.hp <= 0) {
    e.alive = false;
    if (player && !noSp) player.sp = Math.min(player.spMax, player.sp + 15);
    burst(e.x + e.w / 2, e.y + e.h / 2, e.color, e.boss ? 40 : 14);
    floaters.push({ x: e.x + e.w / 2, y: e.y - 4, text: '击破', color: '#ffcf5c', t: 50, vy: -1.2 });
    sfx('hit');
    if (e.boss) {
      clearFlash = 90;
      shake = 26;
      sfx('die');
      state = 'cleared';
      setTimeout(() => clearLevel(), 1200);
    }
  }
}

function updateEnemies() {
  const p = player;
  for (const e of enemies) {
    if (!e.alive) continue;
    e.t++;
    if (e.flash > 0) e.flash--;
    if (e.vx !== 0) e.vx *= 0.82;

    if (e.type === 'boss') { updateBoss(e); }
    else if (e.fly) {
      // 飞行敌人
      if (e.type === 'bat') {
        e.x += e.dir * e.speed * 0.8 + e.vx;
        e.y = e.homeY + Math.sin(e.t * 0.05) * 26;
        if (e.x < e.homeX - 150) e.dir = 1;
        if (e.x > e.homeX + 150) e.dir = -1;
      } else {
        // wraith 缓慢追踪
        const dx = (p.x + p.w / 2) - (e.x + e.w / 2);
        const dy = (p.y + p.h / 2) - (e.y + e.h / 2);
        const d = Math.hypot(dx, dy) || 1;
        e.x += (dx / d) * e.speed * 0.65 + e.vx;
        e.y += (dy / d) * e.speed * 0.42;
        e.y = clamp(e.y, 60, 420);
      }
    } else {
      // 地面巡逻
      const nx = e.x + e.dir * e.speed + e.vx * 0.4;
      let groundAhead = false;
      for (const pl of level.platforms) {
        if (nx + (e.dir > 0 ? e.w : 0) > pl.x && nx + (e.dir > 0 ? e.w : 0) < pl.x + pl.w &&
            Math.abs((e.y + e.h) - pl.y) < 14) { groundAhead = true; break; }
      }
      if (Math.abs(nx - e.homeX) > e.patrol) e.dir *= -1;
      else if (!groundAhead) e.dir *= -1;
      else e.x = nx;
      // 重力
      e.vy = Math.min(e.vy + GRAVITY, MAX_FALL);
      moveWithCollision(e);
      e.y = Math.min(e.y, 470 - e.h);
    }

    // 接触伤害
    if (overlap(p, e) && p.iFrames <= 0) {
      damagePlayer(e.dmg, e.x + e.w / 2);
    }
  }
}

function updateBoss(b) {
  const p = player;
  b.atkCd--;

  if (b.state === 'idle') {
    const dir = (p.x + p.w / 2) < (b.x + b.w / 2) ? -1 : 1;
    b.dir = dir;
    b.x += dir * b.speed * 0.55;
    b.y = b.homeY + Math.sin(b.t * 0.04) * 8;
    if (b.atkCd <= 0) {
      b.state = Math.random() < 0.55 ? 'dash' : 'cast';
      b.atkCd = 60;
      if (b.state === 'dash') { b.dashT = 38; sfx('boss'); }
      else { b.castT = 40; }
    }
  } else if (b.state === 'dash') {
    b.dashT--;
    b.x += b.dir * 9.5;
    if (b.t % 3 === 0) burst(b.x + b.w / 2, b.y + b.h / 2, b.glow, 1);
    if (b.dashT <= 0 || b.x < 40 || b.x + b.w > level.width - 40) {
      b.state = 'idle'; b.atkCd = rand(45, 80); shake = 8;
    }
  } else if (b.state === 'cast') {
    b.castT--;
    b.y -= 0.6;
    if (b.castT === 26) {
      for (let i = -1; i <= 1; i++) {
        const ang = Math.atan2((p.y + p.h / 2) - (b.y + b.h / 2), (p.x + p.w / 2) - (b.x + b.w / 2)) + i * 0.32;
        bullets.push({
          x: b.x + b.w / 2, y: b.y + b.h / 2,
          vx: Math.cos(ang) * 4.6, vy: Math.sin(ang) * 4.6,
          r: 8, dmg: 1, life: 190, color: '#c084fc', trail: []
        });
      }
      sfx('boss'); shake = 6;
    }
    if (b.castT <= 0) { b.state = 'idle'; b.atkCd = rand(50, 85); }
  }

  b.x = clamp(b.x, 20, level.width - b.w - 20);
  b.y = clamp(b.y, 120, 470 - b.h);

  // 击败所有小怪后 boss 变凶
  if (b.hp <= b.maxHp * 0.4 && b.phase === 0) {
    b.phase = 1; b.speed *= 1.4; shake = 18;
    floaters.push({ x: b.x + b.w / 2, y: b.y - 10, text: '影之王 · 暴怒', color: '#a855f7', t: 90, vy: -0.6 });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx; pt.y += pt.vy;
    pt.vy += pt.grav; pt.vx *= 0.97;
    pt.life--;
    if (pt.life <= 0) particles.splice(i, 1);
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y += f.vy; f.t--;
    if (f.t <= 0) floaters.splice(i, 1);
  }
}

/* ================= 渲染 ================= */
function render() {
  const pal = level ? level.palette : { sky: ['#12081f', '#5b2340'], far: '#2a1440', near: '#3d1c4a', ground: '#241a33', groundTop: '#7b4b6a', glow: '#ff8a4c' };
  const cx = cam.x;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // 震动
  let sx = 0, sy = 0;
  if (shake > 0.5) { sx = rand(-shake, shake) * 0.45; sy = rand(-shake, shake) * 0.45; }

  ctx.save();
  ctx.translate(sx, sy);

  drawBackground(pal, cx);

  ctx.save();
  ctx.translate(-cx, 0);

  drawPlatforms(pal);
  drawHazards();
  drawGoal();
  drawStars();
  drawEnemies();
  drawSkillFx();
  if (player) drawPlayer(player);
  drawBullets();
  drawParticles();
  drawFloaters();

  ctx.restore();

  if (state === 'playing' || state === 'paused' || state === 'dying' || state === 'cleared') drawHUD();
  ctx.restore();

  // 通关白闪
  if (clearFlash > 0) {
    ctx.fillStyle = 'rgba(255,240,200,' + (clearFlash / 90 * 0.55) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

function drawBackground(pal, cx) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, pal.sky[0]);
  g.addColorStop(1, pal.sky[1]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 大光晕
  const rg = ctx.createRadialGradient(W * 0.5, H * 0.76, 20, W * 0.5, H * 0.76, 460);
  rg.addColorStop(0, hexA(pal.glow, 0.32));
  rg.addColorStop(0.5, hexA(pal.glow, 0.08));
  rg.addColorStop(1, hexA(pal.glow, 0));
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);

  // 星点
  for (let i = 0; i < 60; i++) {
    const x = ((i * 137.5 + 40) % W + W - cx * 0.06 % W) % W;
    const y = (i * 71 % 300) + 20;
    const tw = 0.35 + Math.abs(Math.sin(frame * 0.02 + i)) * 0.55;
    ctx.fillStyle = 'rgba(255,255,255,' + (tw * 0.42) + ')';
    ctx.fillRect(x, y, 1.6, 1.6);
  }

  // 远山
  drawHills(pal.far, 0.16, 402, 52, 0.0021, cx, 0.9);
  drawHills(pal.near, 0.34, 452, 38, 0.0033, cx, 1);
}

function drawHills(color, par, baseY, amp, freq, cx, alpha) {
  const ox = cx * par;
  ctx.fillStyle = hexA(color, alpha);
  ctx.beginPath();
  ctx.moveTo(-10, H);
  for (let x = -10; x <= W + 10; x += 6) {
    const wx = x + ox;
    const y = baseY + Math.sin(wx * freq) * amp + Math.sin(wx * freq * 2.6 + 1.3) * amp * 0.35;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W + 10, H);
  ctx.closePath();
  ctx.fill();
}

function drawPlatforms(pal) {
  for (const p of level.platforms) {
    // 体积
    const g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
    g.addColorStop(0, pal.ground);
    g.addColorStop(1, hexA('#000000', 0.92));
    ctx.fillStyle = g;
    rect(p.x, p.y, p.w, p.h, p.h > 30 ? 4 : 3);
    ctx.fill();

    // 顶面高光
    ctx.fillStyle = pal.groundTop;
    ctx.fillRect(p.x, p.y, p.w, 3);
    ctx.fillStyle = hexA(pal.glow, 0.5);
    ctx.fillRect(p.x, p.y, p.w, 1.2);

    // 顶部微光
    const gl = ctx.createLinearGradient(0, p.y, 0, p.y + 26);
    gl.addColorStop(0, hexA(pal.glow, 0.16));
    gl.addColorStop(1, hexA(pal.glow, 0));
    ctx.fillStyle = gl;
    ctx.fillRect(p.x, p.y, p.w, 26);

    // 纹理点
    ctx.fillStyle = 'rgba(255,255,255,0.045)';
    for (let i = 8; i < p.w - 4; i += 26) {
      ctx.fillRect(p.x + i, p.y + 9 + ((i * 7) % 12), 5, 2);
    }
  }
}

function drawHazards() {
  for (const h of level.hazards) {
    if (h.kind === 'lava') {
      const g = ctx.createLinearGradient(0, h.y, 0, h.y + h.h);
      g.addColorStop(0, '#ffb347');
      g.addColorStop(0.4, '#ff6b2c');
      g.addColorStop(1, '#7a1a08');
      ctx.fillStyle = g;
      ctx.fillRect(h.x, h.y, h.w, h.h);
      const gl = ctx.createLinearGradient(0, h.y - 46, 0, h.y);
      gl.addColorStop(0, 'rgba(255,120,40,0)');
      gl.addColorStop(1, 'rgba(255,150,60,0.42)');
      ctx.fillStyle = gl;
      ctx.fillRect(h.x, h.y - 46, h.w, 46);
      // 波纹
      ctx.fillStyle = 'rgba(255,230,150,.55)';
      for (let i = 0; i < h.w; i += 16) {
        const off = Math.sin(frame * 0.06 + (h.x + i) * 0.1) * 2.5;
        ctx.fillRect(h.x + i + 2, h.y + off, 9, 2);
      }
    } else {
      ctx.fillStyle = '#c9d4e0';
      const n = Math.floor(h.w / 16);
      for (let i = 0; i < n; i++) {
        const x = h.x + i * 16;
        ctx.beginPath();
        ctx.moveTo(x, h.y + h.h);
        ctx.lineTo(x + 8, h.y);
        ctx.lineTo(x + 16, h.y + h.h);
        ctx.closePath();
        ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,80,80,.35)';
      ctx.fillRect(h.x, h.y + h.h - 3, h.w, 3);
    }
  }
}

function drawGoal() {
  const g = level.goal;
  if (!g) return;
  const cxp = g.x + g.w / 2, cyp = g.y + g.h / 2;
  const pulse = 0.7 + Math.sin(frame * 0.06) * 0.3;

  glowDot(cxp, cyp, 90, hexA('#ffcf5c', 0.36 * pulse));

  // 门框
  ctx.strokeStyle = hexA('#ffcf5c', 0.85);
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(g.x, g.y + g.h);
  ctx.lineTo(g.x, g.y + 18);
  ctx.quadraticCurveTo(cxp, g.y - 14, g.x + g.w, g.y + 18);
  ctx.lineTo(g.x + g.w, g.y + g.h);
  ctx.stroke();

  // 内部流光
  const g2 = ctx.createLinearGradient(0, g.y, 0, g.y + g.h);
  g2.addColorStop(0, hexA('#ffe9a8', 0.55 * pulse));
  g2.addColorStop(1, hexA('#ff7a3d', 0.14));
  ctx.fillStyle = g2;
  ctx.beginPath();
  ctx.moveTo(g.x + 5, g.y + g.h);
  ctx.lineTo(g.x + 5, g.y + 20);
  ctx.quadraticCurveTo(cxp, g.y - 6, g.x + g.w - 5, g.y + 20);
  ctx.lineTo(g.x + g.w - 5, g.y + g.h);
  ctx.closePath();
  ctx.fill();

  // 粒子
  for (let i = 0; i < 4; i++) {
    const t = (frame * 0.02 + i * 1.6) % 1;
    const y = g.y + g.h - t * g.h;
    const x = cxp + Math.sin(t * 8 + i) * 16;
    ctx.fillStyle = hexA('#fff0c0', (1 - t) * 0.85);
    ctx.fillRect(x, y, 2.5, 2.5);
  }
}

function drawStars() {
  for (const s of starList) {
    if (s.got) continue;
    const bob = Math.sin(s.t) * 4;
    const y = s.y + bob;
    glowDot(s.x, y, 20, 'rgba(255,207,92,0.34)');
    ctx.save();
    ctx.translate(s.x, y);
    ctx.rotate(Math.sin(s.t * 0.7) * 0.25);
    ctx.fillStyle = '#ffe9a8';
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2 - Math.PI / 2;
      const a2 = a + Math.PI / 4;
      ctx.lineTo(Math.cos(a) * 11, Math.sin(a) * 11);
      ctx.lineTo(Math.cos(a2) * 4.2, Math.sin(a2) * 4.2);
    }
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fffdf5';
    ctx.beginPath(); ctx.arc(0, 0, 2.6, 0, 6.29); ctx.fill();
    ctx.restore();
  }
}

function drawEnemies() {
  for (const e of enemies) {
    if (!e.alive) continue;
    const flash = e.flash > 0;
    if (e.type === 'slime') drawSlime(e, flash);
    else if (e.type === 'bat') drawBat(e, flash);
    else if (e.type === 'wraith') drawWraith(e, flash);
    else if (e.boss) drawBoss(e, flash);
  }
}

function drawSlime(e, flash) {
  const sq = 1 + Math.sin(e.t * 0.12) * 0.09;
  const w = e.w * sq, h = e.h / sq;
  const x = e.x + e.w / 2, y = e.y + e.h;
  glowDot(x, y - h / 2, 26, hexA(e.color, 0.28));
  ctx.fillStyle = flash ? '#ffffff' : e.color;
  ctx.beginPath();
  ctx.ellipse(x, y - h / 2, w / 2, h / 2, 0, 0, 6.29);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.32)';
  ctx.beginPath();
  ctx.ellipse(x - w * 0.16, y - h * 0.66, w * 0.16, h * 0.14, -0.4, 0, 6.29);
  ctx.fill();
  // 眼睛
  ctx.fillStyle = '#0b2016';
  ctx.beginPath(); ctx.arc(x - 6, y - h * 0.58, 3.2, 0, 6.29); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 6, y - h * 0.58, 3.2, 0, 6.29); ctx.fill();
  ctx.fillStyle = '#eafff0';
  ctx.beginPath(); ctx.arc(x - 6 + e.dir * 1.2, y - h * 0.58, 1.2, 0, 6.29); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 6 + e.dir * 1.2, y - h * 0.58, 1.2, 0, 6.29); ctx.fill();
}

function drawBat(e, flash) {
  const flap = Math.sin(e.t * 0.35) * 0.7;
  const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
  glowDot(cx, cy, 28, hexA(e.color, 0.3));
  ctx.fillStyle = flash ? '#ffffff' : hexA(e.color, 0.88);
  // 翅膀
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.quadraticCurveTo(cx - 16, cy - 16 - flap * 8, cx - 26, cy + 3 + flap * 6);
  ctx.quadraticCurveTo(cx - 12, cy + 2, cx, cy + 6);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.quadraticCurveTo(cx + 16, cy - 16 - flap * 8, cx + 26, cy + 3 + flap * 6);
  ctx.quadraticCurveTo(cx + 12, cy + 2, cx, cy + 6);
  ctx.closePath(); ctx.fill();
  // 身体
  ctx.fillStyle = flash ? '#ffffff' : e.color;
  ctx.beginPath(); ctx.ellipse(cx, cy, 10, 12, 0, 0, 6.29); ctx.fill();
  // 眼
  ctx.fillStyle = '#fff0ff';
  ctx.beginPath(); ctx.arc(cx - 3.6, cy - 2, 2.2, 0, 6.29); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 3.6, cy - 2, 2.2, 0, 6.29); ctx.fill();
}

function drawWraith(e, flash) {
  const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
  const bob = Math.sin(e.t * 0.07) * 4;
  glowDot(cx, cy + bob, 40, hexA(e.color, 0.3));
  ctx.fillStyle = flash ? '#ffffff' : hexA(e.color, 0.72);
  ctx.beginPath();
  ctx.moveTo(cx, e.y + 4 + bob);
  ctx.quadraticCurveTo(e.x + e.w + 4, e.y + e.h * 0.5 + bob, cx + 12, e.y + e.h + bob);
  ctx.quadraticCurveTo(cx, e.y + e.h - 8 + bob, cx - 12, e.y + e.h + bob);
  ctx.quadraticCurveTo(e.x - 4, e.y + e.h * 0.5 + bob, cx, e.y + 4 + bob);
  ctx.closePath(); ctx.fill();
  // 眼
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(cx - 6, e.y + 20 + bob, 3.4, 4.6, 0, 0, 6.29); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 6, e.y + 20 + bob, 3.4, 4.6, 0, 0, 6.29); ctx.fill();
  ctx.fillStyle = '#8e0f3a';
  ctx.beginPath(); ctx.arc(cx - 6, e.y + 20 + bob, 1.6, 0, 6.29); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 6, e.y + 20 + bob, 1.6, 0, 6.29); ctx.fill();
}

function drawBoss(b, flash) {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  const angry = b.phase === 1;
  glowDot(cx, cy, 130, hexA(angry ? '#ff2d6f' : b.glow, 0.32));

  // 暗影触须
  ctx.strokeStyle = hexA(angry ? '#ff2d6f' : '#a855f7', 0.5);
  ctx.lineWidth = 4;
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2 + frame * 0.015;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.quadraticCurveTo(
      cx + Math.cos(a) * 60, cy + Math.sin(a) * 50 + Math.sin(frame * 0.05 + i) * 12,
      cx + Math.cos(a) * 90, cy + Math.sin(a) * 76
    );
    ctx.stroke();
  }

  // 身体
  const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
  g.addColorStop(0, flash ? '#ffffff' : (angry ? '#c026d3' : '#6d28d9'));
  g.addColorStop(1, flash ? '#ffffff' : '#1e0b3a');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(cx, b.y);
  ctx.quadraticCurveTo(b.x + b.w, b.y + b.h * 0.28, b.x + b.w - 8, b.y + b.h);
  ctx.lineTo(b.x + 8, b.y + b.h);
  ctx.quadraticCurveTo(b.x, b.y + b.h * 0.28, cx, b.y);
  ctx.closePath(); ctx.fill();

  // 王冠
  ctx.fillStyle = '#ffcf5c';
  ctx.beginPath();
  ctx.moveTo(cx - 26, b.y + 8);
  ctx.lineTo(cx - 20, b.y - 16);
  ctx.lineTo(cx - 8, b.y + 1);
  ctx.lineTo(cx, b.y - 22);
  ctx.lineTo(cx + 8, b.y + 1);
  ctx.lineTo(cx + 20, b.y - 16);
  ctx.lineTo(cx + 26, b.y + 8);
  ctx.closePath(); ctx.fill();

  // 眼
  const eyeColor = angry ? '#ff3d6e' : '#e9d5ff';
  ctx.fillStyle = eyeColor;
  ctx.shadowColor = eyeColor; ctx.shadowBlur = 22;
  ctx.beginPath(); ctx.ellipse(cx - 17, b.y + 34, 7, 5.5, 0.12, 0, 6.29); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 17, b.y + 34, 7, 5.5, -0.12, 0, 6.29); ctx.fill();
  ctx.shadowBlur = 0;

  // 胸口空洞
  ctx.fillStyle = 'rgba(0,0,0,.85)';
  ctx.beginPath(); ctx.arc(cx, b.y + 68, 13 + Math.sin(frame * 0.08) * 1.5, 0, 6.29); ctx.fill();

  // 血条
  const bw = 150, bx = cx - bw / 2, by = b.y - 54;
  ctx.fillStyle = 'rgba(0,0,0,.6)';
  rect(bx - 2, by - 2, bw + 4, 12, 4); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.12)';
  rect(bx, by, bw, 8, 3); ctx.fill();
  const ratio = Math.max(0, b.hp / b.maxHp);
  const hg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  hg.addColorStop(0, angry ? '#ff2d6f' : '#a855f7');
  hg.addColorStop(1, angry ? '#ff8a4c' : '#c084fc');
  ctx.fillStyle = hg;
  rect(bx, by, bw * ratio, 8, 3); ctx.fill();
  ctx.fillStyle = '#f3e8ff';
  ctx.font = '600 11px system-ui,sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('蚀 · 影之王', cx, by - 9);
  ctx.textAlign = 'left';
}

function drawSkillFx() {
  /* 炎舞斩：一道翻卷的火焰剑气 */
  for (const b of pShots) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.scale(b.dir, 1);
    const fade = Math.min(1, b.life / 20);
    ctx.globalAlpha = fade;

    glowDot(0, 0, 46, hexA(b.color, 0.35));

    // 弧形刀身
    const g = ctx.createLinearGradient(-26, 0, 26, 0);
    g.addColorStop(0, 'rgba(255,122,61,0)');
    g.addColorStop(0.55, 'rgba(255,170,90,.9)');
    g.addColorStop(1, '#fff6d0');
    ctx.strokeStyle = g;
    ctx.lineWidth = 9;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(-6, 0, 34, -1.05, 1.05);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,240,200,.85)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(-12, 0, 26, -0.95, 0.95);
    ctx.stroke();
    ctx.restore();
  }

  /* 焚天 · 归火：以玩家为中心扩散的火环 */
  const p = player;
  if (p && p.novaT > 0) {
    const prog = 1 - p.novaT / 64;          // 0 → 1
    const r = 40 + prog * 460;
    const a = Math.max(0, 1 - prog * 1.05);
    const cx = p.x + p.w / 2, cy = p.y + p.h / 2;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // 外环
    ctx.strokeStyle = 'rgba(255,207,92,' + (a * 0.9) + ')';
    ctx.lineWidth = 14 * (1 - prog) + 2;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.29); ctx.stroke();
    // 内环
    ctx.strokeStyle = 'rgba(255,122,61,' + (a * 0.7) + ')';
    ctx.lineWidth = 8 * (1 - prog) + 1;
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.72, 0, 6.29); ctx.stroke();
    // 中心火核
    glowDot(cx, cy, 120 * (1 - prog) + 20, 'rgba(255,190,110,' + (a * 0.8) + ')');
    ctx.restore();
  }
}

function drawPlayer(p) {
  const blink = p.iFrames > 0 && Math.floor(frame / 4) % 2 === 0;
  ctx.save();
  ctx.globalAlpha = blink ? 0.4 : 1;

  const cx = p.x + p.w / 2, by = p.y + p.h;
  const walking = p.onGround && Math.abs(p.vx) > 0.6;
  const legSw = walking ? Math.sin(p.animTime * 0.32) * 5 : 0;

  // 地面投影
  if (p.onGround) {
    ctx.fillStyle = 'rgba(0,0,0,.32)';
    ctx.beginPath(); ctx.ellipse(cx, by + 1, 15, 4.5, 0, 0, 6.29); ctx.fill();
  }

  // 身体光
  glowDot(cx, by - 20, 46, 'rgba(255,122,61,.30)');

  ctx.save();
  ctx.translate(cx, by);
  ctx.scale(p.facing, 1);

  // 披风
  const capeSwing = Math.sin(p.animTime * 0.14) * 4 + (walking ? 4 : 0);
  ctx.fillStyle = 'rgba(180,50,30,.85)';
  ctx.beginPath();
  ctx.moveTo(-6, -36);
  ctx.quadraticCurveTo(-20 - capeSwing, -22, -14 - capeSwing * 0.6, -2);
  ctx.quadraticCurveTo(-8, -8, -3, -14);
  ctx.closePath(); ctx.fill();

  // 腿
  ctx.fillStyle = '#2a1c34';
  ctx.fillRect(-7, -16 + legSw * 0.4, 6.5, 16 - legSw * 0.4);
  ctx.fillRect(1, -16 - legSw * 0.4, 6.5, 16 + legSw * 0.4);
  ctx.fillStyle = '#4a2f42';
  ctx.fillRect(-8, -3, 8, 3.5);
  ctx.fillRect(1, -3, 8, 3.5);

  // 身体
  const bg = ctx.createLinearGradient(0, -38, 0, -12);
  bg.addColorStop(0, '#ff9a5c');
  bg.addColorStop(1, '#c2482a');
  ctx.fillStyle = bg;
  rect(-9, -37, 18, 23, 5); ctx.fill();

  // 胸口火种
  const pulse = 0.6 + Math.sin(p.animTime * 0.1) * 0.4;
  glowDot(0, -28, 12 * pulse, 'rgba(255,220,140,.85)');

  // 头
  ctx.fillStyle = '#241a30';
  rect(-8.5, -52, 17, 15, 5); ctx.fill();
  // 护目镜
  ctx.fillStyle = '#ffcf5c';
  ctx.fillRect(-2, -47, 10, 4);
  ctx.fillStyle = '#fff6d0';
  ctx.fillRect(2, -46.4, 5, 2.4);
  // 头发/火苗
  ctx.fillStyle = '#ff7a3d';
  ctx.beginPath();
  ctx.moveTo(-7, -52);
  ctx.quadraticCurveTo(-4, -60, 0, -53);
  ctx.quadraticCurveTo(3, -62, 6, -53);
  ctx.closePath(); ctx.fill();

  // 剑
  const atk = p.atkTimer > 0;
  if (atk) {
    const prog = 1 - p.atkTimer / 12;
    const ang = -1.1 + prog * 2.3;
    ctx.save();
    ctx.translate(6, -26);
    ctx.rotate(ang);
    // 刀身
    const sg = ctx.createLinearGradient(0, 0, 0, -34);
    sg.addColorStop(0, '#fff8dc');
    sg.addColorStop(0.5, '#ffcf5c');
    sg.addColorStop(1, 'rgba(255,122,61,.2)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.moveTo(-2.5, 0); ctx.lineTo(-1.5, -32); ctx.lineTo(2, -38); ctx.lineTo(4, -30); ctx.lineTo(3.5, 0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8a5a3a';
    ctx.fillRect(-4, -2, 9, 4);
    ctx.restore();

    // 刀光弧
    ctx.strokeStyle = 'rgba(255,235,180,' + (0.85 - prog * 0.7) + ')';
    ctx.lineWidth = 6 - prog * 3;
    ctx.beginPath();
    ctx.arc(6, -26, 40, -1.2 + prog * 1.4, -0.2 + prog * 1.9);
    ctx.stroke();
  } else {
    // 收剑
    ctx.save();
    ctx.translate(-9, -22);
    ctx.rotate(-0.5);
    ctx.fillStyle = '#9fb0c0';
    ctx.fillRect(-1.5, -22, 3, 22);
    ctx.fillStyle = '#8a5a3a';
    ctx.fillRect(-3.5, -2, 7, 3);
    ctx.restore();
  }

  ctx.restore();
  ctx.restore();
}

function drawBullets() {
  for (const b of bullets) {
    if (b.trail) {
      for (let i = 0; i < b.trail.length; i++) {
        const t = b.trail[i];
        ctx.fillStyle = hexA(b.color, (i / b.trail.length) * 0.4);
        ctx.beginPath(); ctx.arc(t.x, t.y, b.r * (i / b.trail.length) * 0.9, 0, 6.29); ctx.fill();
      }
    }
    glowDot(b.x, b.y, b.r * 3, hexA(b.color, 0.55));
    ctx.fillStyle = '#f5e8ff';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.62, 0, 6.29); ctx.fill();
    ctx.strokeStyle = b.color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.29); ctx.stroke();
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawFloaters() {
  ctx.textAlign = 'center';
  for (const f of floaters) {
    ctx.globalAlpha = Math.min(1, f.t / 22);
    ctx.font = '800 16px system-ui,sans-serif';
    ctx.fillStyle = f.color;
    ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 6;
    ctx.fillText(f.text, f.x, f.y);
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

function drawHUD() {
  if (!player) return;
  // 心
  for (let i = 0; i < player.maxHp; i++) {
    drawHeart(26 + i * 27, 30, i < player.hp);
  }
  // 星火
  ctx.save();
  ctx.translate(26, 58);
  ctx.fillStyle = '#ffcf5c';
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2 - Math.PI / 2, a2 = a + Math.PI / 4;
    ctx.lineTo(Math.cos(a) * 8, Math.sin(a) * 8);
    ctx.lineTo(Math.cos(a2) * 3, Math.sin(a2) * 3);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.font = '800 15px system-ui,sans-serif';
  ctx.fillStyle = '#ffe9a8';
  ctx.textAlign = 'left';
  ctx.fillText(starsCollected + ' / ' + starList.length, 42, 63);

  // 关卡名
  ctx.textAlign = 'center';
  ctx.font = '800 15px "PingFang SC",system-ui,sans-serif';
  ctx.fillStyle = 'rgba(255,231,190,.9)';
  ctx.fillText(level.chapter + ' · ' + level.name, W / 2, 34);
  ctx.font = '500 11px "PingFang SC",system-ui,sans-serif';
  ctx.fillStyle = 'rgba(200,190,225,.55)';
  ctx.fillText(level.subtitle, W / 2, 52);
  ctx.textAlign = 'left';

  // 攻击冷却提示
  if (player.atkCd > 0) {
    ctx.fillStyle = 'rgba(255,207,92,.18)';
    ctx.fillRect(W - 40, 24, 4, 40);
    ctx.fillStyle = 'rgba(255,207,92,.7)';
    const h = 40 * (1 - player.atkCd / 24);
    ctx.fillRect(W - 40, 64 - h, 4, h);
  }

  drawSkillBar();
}

/* 底部技能栏：灵力条 + 三个技能槽（冷却 / 灵力不足 / 未习得） */
function drawSkillBar() {
  const p = player;
  if (!p) return;
  const size = 54, gap = 12;
  const total = size * 3 + gap * 2;
  const x0 = (W - total) / 2;
  const y0 = H - 70;

  ctx.save();
  ctx.textAlign = 'center';

  /* --- 灵力条 --- */
  const bx = x0, by = y0 - 14, bw = total, bh = 7;
  ctx.fillStyle = 'rgba(8,6,16,.72)';
  rect(bx, by, bw, bh, 3.5); ctx.fill();
  const ratio = p.sp / p.spMax;
  if (ratio > 0) {
    const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    g.addColorStop(0, '#ff7a3d');
    g.addColorStop(0.6, '#ffcf5c');
    g.addColorStop(1, '#7fe6ff');
    ctx.fillStyle = g;
    rect(bx, by, Math.max(2, bw * ratio), bh, 3.5); ctx.fill();
    // 满灵力时高光流动
    if (ratio >= 1) {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.25 + Math.sin(frame * 0.12) * 0.2) + ')';
      rect(bx, by, bw, bh, 3.5); ctx.fill();
    }
  }
  ctx.strokeStyle = 'rgba(255,255,255,.10)';
  ctx.lineWidth = 1;
  rect(bx + 0.5, by + 0.5, bw - 1, bh - 1, 3.5); ctx.stroke();

  ctx.font = '700 9.5px "PingFang SC",system-ui,sans-serif';
  ctx.fillStyle = 'rgba(190,182,215,.65)';
  ctx.textAlign = 'right';
  ctx.fillText('灵 力 ' + Math.floor(p.sp), bx - 8, by + 7);

  /* --- 技能槽 --- */
  ctx.textAlign = 'center';
  for (let i = 0; i < SKILLS.length; i++) {
    const s = SKILLS[i];
    const x = x0 + i * (size + gap);
    const unlocked = skillUnlocked(i);
    const cd = p.skCd[i];
    const ready = unlocked && cd <= 0 && p.sp >= s.cost;

    // 底板
    ctx.fillStyle = 'rgba(8,6,16,.74)';
    rect(x, y0, size, size, 10); ctx.fill();

    // 边框：就绪时呼吸发光
    if (ready) {
      ctx.shadowColor = hexA(s.color, 0.9);
      ctx.shadowBlur = 10 + Math.sin(frame * 0.1) * 4;
    }
    ctx.strokeStyle = unlocked ? hexA(s.color, ready ? 0.95 : 0.35) : 'rgba(255,255,255,.13)';
    ctx.lineWidth = 1.8;
    rect(x + 0.9, y0 + 0.9, size - 1.8, size - 1.8, 9.5); ctx.stroke();
    ctx.shadowBlur = 0;

    // 图标字
    ctx.font = '800 22px "PingFang SC",system-ui,sans-serif';
    ctx.fillStyle = unlocked ? (ready ? s.color : hexA(s.color, 0.5)) : 'rgba(255,255,255,.16)';
    ctx.fillText(unlocked ? s.glyph : '锁', x + size / 2, y0 + 34);

    // 键位角标
    ctx.font = '800 9px system-ui,sans-serif';
    ctx.fillStyle = ready ? 'rgba(255,255,255,.92)' : 'rgba(255,255,255,.35)';
    ctx.textAlign = 'left';
    ctx.fillText(s.key, x + 6, y0 + 13);
    ctx.textAlign = 'center';

    // 冷却遮罩（从下往上退去）
    if (cd > 0) {
      const r = cd / s.cd;
      ctx.fillStyle = 'rgba(4,3,10,.72)';
      rect(x + 1, y0 + size * (1 - r), size - 2, size * r - 1, 9); ctx.fill();
      ctx.font = '800 15px system-ui,sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      ctx.fillText((cd / 60).toFixed(1), x + size / 2, y0 + size / 2 + 6);
    } else if (unlocked && p.sp < s.cost) {
      // 灵力不足
      ctx.fillStyle = 'rgba(4,3,10,.55)';
      rect(x + 1, y0 + 1, size - 2, size - 1, 9); ctx.fill();
      ctx.font = '800 10px "PingFang SC",system-ui,sans-serif';
      ctx.fillStyle = 'rgba(127,230,255,.8)';
      ctx.fillText(s.cost, x + size / 2, y0 + size / 2 + 4);
    }

    // 技能名
    ctx.font = '700 9px "PingFang SC",system-ui,sans-serif';
    ctx.fillStyle = unlocked ? 'rgba(220,213,238,.75)' : 'rgba(160,152,185,.4)';
    ctx.fillText(s.name.replace(' · ', '·'), x + size / 2, y0 + size + 11);
  }
  ctx.restore();
}

function drawHeart(x, y, full) {
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  ctx.moveTo(0, 5);
  ctx.bezierCurveTo(-11, -4, -7, -14, 0, -8);
  ctx.bezierCurveTo(7, -14, 11, -4, 0, 5);
  ctx.closePath();
  if (full) {
    const g = ctx.createLinearGradient(0, -12, 0, 6);
    g.addColorStop(0, '#ff8a8a');
    g.addColorStop(1, '#e02e4a');
    ctx.fillStyle = g;
    ctx.shadowColor = 'rgba(255,60,90,.7)'; ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
  } else {
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.22)';
    ctx.lineWidth = 1.2; ctx.stroke();
  }
  ctx.restore();
}

/* ================= 主循环 ================= */
let lastT = 0, acc = 0, started = false;
const STEP = 1000 / 60;
function loop(t) {
  requestAnimationFrame(loop);
  if (!started) { started = true; lastT = t; }
  let dt = t - lastT;
  lastT = t;
  if (dt > 120) dt = 120;
  acc += dt;
  let guard = 0;
  // 按键按下只在 update() 内部被消费，这里绝不能清空。
  // 否则在 120/144Hz 屏幕上，那些没有执行 update 的帧会把跳跃输入直接吞掉。
  while (acc >= STEP && guard < 5) { update(); acc -= STEP; guard++; }
  render();
}

/* ================= 缩放适配 ================= */
function fit() {
  const s = Math.min((window.innerWidth * 0.97) / W, (window.innerHeight * 0.95) / H, 1.55);
  stageEl.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit);

/* ================= 存档 ================= */
const SAVE_KEY = 'flamewalker_save_v1';
let saveData = { progress: 0 };
try {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) saveData = Object.assign(saveData, JSON.parse(raw));
} catch (e) {}
function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(saveData)); } catch (e) {}
}

/* ================= 屏幕切换 ================= */
const SCREENS = ['title', 'chars', 'levels', 'dialog', 'result', 'pause'];
function showScreen(name) {
  SCREENS.forEach(s => {
    const el = document.getElementById('screen-' + s);
    if (el) el.classList.toggle('on', s === name);
  });
}
function hideAllScreens() { SCREENS.forEach(s => document.getElementById('screen-' + s).classList.remove('on')); }

/* ================= 人物志 ================= */
function buildChars() {
  const grid = document.getElementById('char-grid');
  grid.innerHTML = CHARACTERS.map(c => `
    <div class="char-card" style="border-color:${hexA(c.color, .22)}">
      <div class="char-avatar" style="background:linear-gradient(160deg,${hexA(c.color, .55)},${hexA(c.color, .12)});color:#fff;box-shadow:0 0 22px ${hexA(c.color, .35)} inset;">${c.emoji}</div>
      <div class="char-info">
        <div class="char-name" style="color:${c.color}">${c.name}<span class="char-role" style="color:${c.color}">${c.role}</span></div>
        <div class="char-desc">${c.desc}</div>
        <div class="char-stat">${c.stat}</div>
        ${c.skill ? `<div class="char-skill" style="border-left-color:${hexA(c.color, .8)}">
            <span class="sk-name">${c.skill.name}</span><span class="sk-key">${c.skill.key}</span><br>${c.skill.text}
          </div>` : ''}
      </div>
    </div>`).join('');
}

/* ================= 关卡选择 ================= */
function buildLevels() {
  const grid = document.getElementById('lv-grid');
  grid.innerHTML = LEVELS.map((lv, i) => {
    const locked = i > saveData.progress;
    const cleared = i < saveData.progress;
    return `<div class="lv-card ${locked ? 'locked' : ''}" data-i="${i}">
      <div class="lv-no">0${i + 1}</div>
      <div class="lv-name">${lv.name}</div>
      <div class="lv-sub">${lv.chapter} · ${lv.subtitle}</div>
      <div class="lv-badge">${locked ? '未 解 锁' : (cleared ? '已 通 关' : '可 挑 战')}</div>
    </div>`;
  }).join('');
  grid.querySelectorAll('.lv-card').forEach(el => {
    el.addEventListener('click', () => {
      const i = parseInt(el.dataset.i, 10);
      if (i > saveData.progress) { sfx('ui'); return; }
      sfx('ui');
      startLevel(i);
    });
  });
}

function refreshButtons() {
  const cont = document.getElementById('btn-continue');
  cont.disabled = saveData.progress <= 0;
}

/* ================= 对话系统 ================= */
let dlg = { lines: [], idx: 0, shown: 0, typing: false, onEnd: null, timer: null };

function playDialogue(lines, onEnd) {
  dlg.lines = lines; dlg.idx = 0; dlg.onEnd = onEnd;
  clearPressed();
  state = 'dialog';
  showScreen('dialog');
  renderDlgLine();
}

function renderDlgLine() {
  const line = dlg.lines[dlg.idx];
  if (!line) { endDialogue(); return; }
  document.getElementById('dlg-name').textContent = line.who;
  document.getElementById('dlg-name').style.background =
    'linear-gradient(180deg, ' + line.color + ', ' + hexA(line.color, .45) + ')';
  document.getElementById('dlg-name').style.color = '#14101f';
  document.getElementById('dlg-scene').textContent = line.emoji || '✦';
  document.getElementById('dlg-hint').style.visibility = 'hidden';

  const el = document.getElementById('dlg-text');
  el.textContent = '';
  dlg.shown = 0; dlg.typing = true;
  clearInterval(dlg.timer);
  dlg.timer = setInterval(() => {
    dlg.shown += 1;
    el.textContent = line.text.slice(0, dlg.shown);
    if (dlg.shown % 3 === 0) beep(1400 + Math.random() * 200, 0.012, 'square', 0.012);
    if (dlg.shown >= line.text.length) {
      clearInterval(dlg.timer);
      dlg.typing = false;
      document.getElementById('dlg-hint').style.visibility = 'visible';
    }
  }, 28);
}

function advanceDialogue() {
  if (dlg.typing) {
    clearInterval(dlg.timer);
    dlg.typing = false;
    document.getElementById('dlg-text').textContent = dlg.lines[dlg.idx].text;
    document.getElementById('dlg-hint').style.visibility = 'visible';
    return;
  }
  dlg.idx++;
  if (dlg.idx >= dlg.lines.length) endDialogue();
  else { sfx('ui'); renderDlgLine(); }
}

function endDialogue() {
  clearInterval(dlg.timer);
  const cb = dlg.onEnd;
  dlg.onEnd = null;
  hideAllScreens();
  if (cb) cb();
}

/* ================= 游戏流程 ================= */
let clearing = false;
function startLevel(idx) {
  loadLevel(idx);
  clearing = false;
  clearPressed();
  state = 'playing';
  hideAllScreens();
  document.getElementById('touch').classList.toggle('on', 'ontouchstart' in window || navigator.maxTouchPoints > 0);
  if (window.innerWidth < 700) {}
  sfx('ui');
}

function startNewGame() {
  startLevel(0);
}

function clearLevel() {
  if (clearing) return;
  clearing = true;
  state = 'cleared';
  sfx('clear');
  const next = levelIndex + 1;
  const progressBefore = saveData.progress;
  if (next > saveData.progress) saveData.progress = Math.min(next, LEVELS.length - 1);
  persist();
  // 本章是否解锁了新技能
  const learned = SKILLS.filter(s => s.unlock > progressBefore && s.unlock <= saveData.progress);
  buildLevels();
  refreshButtons();

  const timeSec = (levelFrames / 60).toFixed(1);
  const isLast = levelIndex === LEVELS.length - 1;
  const learnTip = learned.length ? ' · 习得「' + learned.map(s => s.name).join('」「') + '」' : '';

  showResult({
    win: true,
    title: isLast ? '三 界 重 燃' : '关 卡 通 过',
    sub: (isLast ? 'THE END · 但火还在烧' : 'CHAPTER CLEAR · ' + level.chapter) + learnTip,
    stats: [
      { k: '星火', v: starsCollected + '/' + starList.length },
      { k: '用时', v: timeSec + 's' },
      { k: '残血', v: player.hp + '/' + player.maxHp }
    ],
    actions: [
      {
        text: isLast ? '看 结 局' : '继 续',
        primary: true,
        onClick: () => {
          const key = LEVEL_END_STORY[levelIndex];
          playDialogue(DIALOGUES[key], () => {
            if (isLast) {
              showVictory();
            } else {
              startLevel(levelIndex + 1);
            }
          });
        }
      },
      { text: '返 回 标 题', onClick: () => toTitle() }
    ]
  });
}

function showVictory() {
  state = 'title';
  showResult({
    win: true,
    title: '全 剧 终',
    sub: '谢谢你陪他走完了这一夜',
    stats: [
      { k: '关卡', v: '4/4' },
      { k: '火种', v: '★' },
      { k: '结局', v: '重燃' }
    ],
    actions: [
      { text: '再 走 一 遍', primary: true, onClick: () => { startNewGame(); } },
      { text: '返 回 标 题', onClick: () => toTitle() }
    ]
  });
}

function showGameOver() {
  state = 'title';
  showResult({
    win: false,
    title: '火 种 熄 灭',
    sub: 'GAME OVER · ' + level.chapter,
    stats: [
      { k: '到达', v: level.name },
      { k: '星火', v: starsCollected + '/' + starList.length },
      { k: '用时', v: (levelFrames / 60).toFixed(1) + 's' }
    ],
    actions: [
      { text: '再 试 一 次', primary: true, onClick: () => { startLevel(levelIndex); } },
      { text: '返 回 标 题', onClick: () => toTitle() }
    ]
  });
}

function showResult(opt) {
  state = 'result';
  showScreen('result');
  const t = document.getElementById('res-title');
  t.textContent = opt.title;
  t.className = 'res-title' + (opt.win ? '' : ' lose');
  document.getElementById('res-sub').textContent = opt.sub;
  document.getElementById('res-stats').innerHTML = opt.stats.map(s =>
    `<div class="res-item"><div class="k">${s.k}</div><div class="v">${s.v}</div></div>`).join('');

  const act = document.getElementById('res-actions');
  act.innerHTML = '';
  opt.actions.forEach((a, i) => {
    const b = document.createElement('button');
    b.className = 'btn small' + (a.primary ? '' : ' ghost');
    b.textContent = a.text;
    b.addEventListener('click', () => { sfx('ui'); a.onClick(); });
    act.appendChild(b);
  });
}

function toTitle() {
  state = 'title';
  loadLevel(Math.min(saveData.progress, LEVELS.length - 1));
  showScreen('title');
  refreshButtons();
  buildLevels();
}

/* ================= 暂停 / 静音 ================= */
function togglePause() {
  if (state === 'playing') {
    state = 'paused';
    showScreen('pause');
  } else if (state === 'paused') {
    state = 'playing';
    clearPressed();
    hideAllScreens();
  }
}
function toggleMute() {
  muted = !muted;
  document.getElementById('mute-btn').textContent = muted ? '✕' : '♪';
  document.getElementById('mute-btn').style.color = muted ? '#6d6585' : '#c9c1e0';
}

/* ================= 事件绑定 ================= */
document.getElementById('btn-start').addEventListener('click', () => {
  sfx('ui');
  playDialogue(DIALOGUES.intro, () => startLevel(0));
});
document.getElementById('btn-continue').addEventListener('click', () => {
  sfx('ui');
  startLevel(Math.min(saveData.progress, LEVELS.length - 1));
});
document.getElementById('btn-chars').addEventListener('click', () => { sfx('ui'); buildChars(); showScreen('chars'); });
document.getElementById('btn-levels').addEventListener('click', () => { sfx('ui'); buildLevels(); showScreen('levels'); });
document.getElementById('btn-chars-back').addEventListener('click', () => { sfx('ui'); showScreen('title'); });
document.getElementById('btn-levels-back').addEventListener('click', () => { sfx('ui'); showScreen('title'); });
document.getElementById('btn-resume').addEventListener('click', () => { sfx('ui'); togglePause(); });
document.getElementById('btn-restart').addEventListener('click', () => { sfx('ui'); startLevel(levelIndex); });
document.getElementById('btn-quit').addEventListener('click', () => { sfx('ui'); toTitle(); });
document.getElementById('mute-btn').addEventListener('click', (e) => { e.stopPropagation(); toggleMute(); });

document.getElementById('screen-dialog').addEventListener('click', advanceDialogue);
document.getElementById('screen-dialog').addEventListener('wheel', advanceDialogue, { passive: true });

/* ================= 启动 ================= */
buildChars();
buildLevels();
refreshButtons();
fit();
loadLevel(0);
state = 'title';
requestAnimationFrame(loop);

// 调试入口：#play=1 直接进第1关，加 run 自动向右走，加 cast 自动放技能
(function () {
  const m = (location.hash || '').match(/#play=(\d)(run)?(cast)?/);
  if (m) {
    saveData.progress = 3;   // 调试模式解锁全部技能
    setTimeout(() => {
      startLevel(parseInt(m[1], 10) - 1);
      if (m[2]) { keys.right = true; setInterval(() => { keys.right = true; }, 500); }
      if (m[3]) {
        let n = 0;
        setInterval(() => {
          if (state !== 'playing' || !player) return;
          player.sp = player.spMax; player.skCd = [0, 0, 0];
          castSkill(n % 3); n++;
        }, 900);
      }
    }, 80);
  }
  const sm = (location.hash || '').match(/#screen=(\w+)/);
  if (sm) {
    setTimeout(() => {
      const s = sm[1];
      if (s === 'chars') { buildChars(); showScreen('chars'); }
      else if (s === 'levels') { buildLevels(); showScreen('levels'); }
      else if (s === 'dialog') { playDialogue(DIALOGUES.intro, function () {}); }
      else if (s === 'result') { startLevel(0); state = 'result'; showGameOver(); }
    }, 80);
  }
})();

</script>
