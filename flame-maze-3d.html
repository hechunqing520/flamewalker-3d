<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>焰行者 · 迷宫三境（3D）</title>
<style>
  :root{ --gold:#ffcf5c; --flame:#ff7a3d; }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#05040a;}
  body{
    display:flex;align-items:center;justify-content:center;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    color:#e8e4f5;
    background:radial-gradient(circle at 50% 35%, #1b1035 0%, #06040c 68%);
    -webkit-user-select:none;user-select:none;
  }
  #stage{
    position:relative;width:960px;height:540px;
    transform-origin:center center;border-radius:14px;overflow:hidden;
    box-shadow:0 0 0 1px rgba(255,207,92,.16), 0 30px 90px rgba(0,0,0,.85);
    background:#05040a;
  }
  #stage canvas{display:block;position:absolute;inset:0;}

  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:10;}
  .screen.on{display:flex;}

  /* ===== 标题 ===== */
  #screen-title{
    background:
      radial-gradient(ellipse at 50% 78%, rgba(255,122,61,.30) 0%, rgba(255,122,61,0) 55%),
      radial-gradient(ellipse at 50% 30%, rgba(120,70,220,.22) 0%, rgba(0,0,0,0) 60%),
      linear-gradient(180deg, rgba(6,4,14,.86) 0%, rgba(6,4,14,.72) 45%, rgba(6,4,14,.94) 100%);
  }
  .title-han{
    font-size:72px;font-weight:900;letter-spacing:.16em;line-height:1;color:#ffe9c4;text-align:center;
    text-shadow:0 0 2px #fff,0 0 18px rgba(255,122,61,.95),0 0 46px rgba(255,122,61,.55),0 8px 0 rgba(120,40,10,.55);
    animation:titleGlow 3.2s ease-in-out infinite;
  }
  @keyframes titleGlow{
    0%,100%{text-shadow:0 0 2px #fff,0 0 18px rgba(255,122,61,.95),0 0 46px rgba(255,122,61,.5),0 8px 0 rgba(120,40,10,.55);}
    50%{text-shadow:0 0 3px #fff,0 0 26px rgba(255,170,90,1),0 0 68px rgba(255,122,61,.8),0 8px 0 rgba(120,40,10,.55);}
  }
  .title-sub{margin-top:10px;font-size:14px;letter-spacing:.7em;color:#ffb27a;text-indent:.7em;text-align:center;}
  .title-line{width:340px;height:1px;margin:18px auto 0;background:linear-gradient(90deg,transparent,rgba(255,207,92,.7),transparent);}
  .title-desc{margin-top:14px;font-size:12.5px;color:#8e86a8;letter-spacing:.12em;text-align:center;line-height:1.9;}
  .menu{display:flex;flex-direction:column;gap:10px;margin-top:22px;}
  .btn{
    min-width:230px;padding:10px 28px;border-radius:9px;
    border:1px solid rgba(255,207,92,.36);
    background:linear-gradient(180deg, rgba(255,122,61,.14), rgba(255,122,61,.03));
    color:#ffe0b8;font-size:15px;letter-spacing:.26em;text-indent:.26em;
    font-family:inherit;font-weight:600;cursor:pointer;transition:.16s;
  }
  .btn:hover{background:linear-gradient(180deg, rgba(255,122,61,.36), rgba(255,122,61,.10));border-color:var(--gold);transform:translateY(-2px);box-shadow:0 10px 26px rgba(255,122,61,.28);}
  .btn:active{transform:translateY(0);}
  .btn.small{min-width:150px;font-size:13px;padding:8px 18px;letter-spacing:.16em;text-indent:.16em;}
  .btn.ghost{border-color:rgba(160,150,200,.3);color:#b9b1d0;background:rgba(255,255,255,.02);}
  .btn.ghost:hover{background:rgba(255,255,255,.07);border-color:rgba(200,190,240,.6);box-shadow:none;}
  .btn:disabled{opacity:.32;cursor:not-allowed;transform:none;box-shadow:none;}
  .tip{position:absolute;bottom:14px;width:100%;text-align:center;font-size:11px;color:#6d6585;letter-spacing:.1em;}
  .tip b{color:#a89dc4;font-weight:600;}

  /* ===== 面板 ===== */
  .panel{
    width:100%;max-width:800px;
    background:linear-gradient(180deg, rgba(20,14,38,.94), rgba(10,7,20,.96));
    border:1px solid rgba(255,207,92,.20);border-radius:14px;
    box-shadow:0 26px 70px rgba(0,0,0,.7);padding:24px 28px;
  }
  .panel-head{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid rgba(255,207,92,.14);padding-bottom:12px;margin-bottom:16px;}
  .panel-head h2{font-size:20px;letter-spacing:.28em;color:#ffe0b8;font-weight:800;text-shadow:0 0 16px rgba(255,122,61,.5);}
  .panel-head span{font-size:11px;color:#716991;letter-spacing:.2em;}

  /* ===== 人物 ===== */
  .char-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .char-card{display:flex;gap:12px;padding:12px;background:linear-gradient(135deg, rgba(255,255,255,.045), rgba(255,255,255,.012));border:1px solid rgba(255,255,255,.075);border-radius:11px;transition:.2s;}
  .char-card:hover{border-color:rgba(255,207,92,.5);transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.45);}
  .char-avatar{flex:0 0 56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;border:1px solid rgba(255,255,255,.14);}
  .char-name{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .char-role{font-size:9.5px;padding:1px 7px;border-radius:20px;font-weight:600;letter-spacing:.1em;border:1px solid currentColor;opacity:.9;}
  .char-desc{margin-top:5px;font-size:11px;line-height:1.7;color:#9a93b3;}
  .char-stat{margin-top:5px;font-size:10px;color:#7d769a;}
  .char-stat b{color:#ffcf5c;}

  /* ===== 关卡 ===== */
  .lv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;}
  .lv-card{position:relative;padding:14px 12px;border-radius:11px;cursor:pointer;background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.012));border:1px solid rgba(255,255,255,.08);transition:.2s;text-align:center;}
  .lv-card.locked{opacity:.4;cursor:not-allowed;filter:grayscale(.8);}
  .lv-card:not(.locked):hover{transform:translateY(-4px);border-color:rgba(255,207,92,.6);box-shadow:0 16px 34px rgba(0,0,0,.55);}
  .lv-no{font-size:24px;font-weight:900;color:rgba(255,207,92,.85);}
  .lv-name{margin-top:7px;font-size:12.5px;font-weight:700;color:#e9e2ff;}
  .lv-sub{margin-top:4px;font-size:10px;color:#7d769a;line-height:1.6;}
  .lv-badge{margin-top:8px;font-size:9.5px;letter-spacing:.14em;color:#ffcf5c;opacity:.85;}
  .lv-card.locked .lv-badge{color:#6d6585;}

  /* ===== 对话 ===== */
  #screen-dialog{justify-content:flex-end;padding:0;cursor:pointer;
    background:linear-gradient(180deg, rgba(5,4,11,.35) 0%, rgba(5,4,11,.88) 100%);}
  .dlg-scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:130px;opacity:.15;}
  .dlg-box{position:relative;width:100%;background:linear-gradient(180deg, rgba(16,11,30,.96), rgba(8,6,16,.99));border-top:1px solid rgba(255,207,92,.28);padding:18px 36px 22px;min-height:140px;}
  .dlg-name{display:inline-block;margin-top:-34px;margin-bottom:9px;padding:5px 18px;border-radius:8px;font-size:13px;font-weight:800;letter-spacing:.2em;color:#14101f;background:linear-gradient(180deg, #ffcf5c, #ff8a4c);box-shadow:0 6px 18px rgba(255,100,40,.35);}
  .dlg-text{font-size:15px;line-height:2;color:#dcd5ee;min-height:60px;}
  .dlg-hint{position:absolute;right:36px;bottom:14px;font-size:10.5px;color:#ffcf5c;letter-spacing:.16em;animation:blink 1.1s steps(2,end) infinite;}
  @keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:.15}}

  /* ===== 结算 / 暂停 ===== */
  .res-title{font-size:32px;font-weight:900;letter-spacing:.24em;color:#ffe9c4;text-indent:.24em;text-shadow:0 0 26px rgba(255,122,61,.8);}
  .res-title.lose{color:#ff8f8f;text-shadow:0 0 26px rgba(255,60,60,.7);}
  .res-sub{margin-top:9px;font-size:12px;color:#8e86a8;letter-spacing:.2em;text-align:center;}
  .res-stats{display:flex;gap:11px;justify-content:center;margin:22px 0 6px;}
  .res-item{min-width:100px;padding:11px 10px;border-radius:10px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);text-align:center;}
  .res-item .k{font-size:10px;color:#8a83a6;letter-spacing:.14em;}
  .res-item .v{margin-top:5px;font-size:20px;font-weight:900;color:#ffcf5c;}
  .res-actions{display:flex;gap:11px;justify-content:center;margin-top:22px;}

  /* ===== HUD ===== */
  #hud{position:absolute;inset:0;pointer-events:none;z-index:5;display:none;}
  #hud.on{display:block;}
  #hud-hearts{position:absolute;top:14px;left:18px;font-size:19px;letter-spacing:3px;text-shadow:0 0 8px rgba(255,60,90,.6);}
  #hud-stars{position:absolute;top:14px;right:18px;font-size:16px;font-weight:800;color:#ffe9a8;text-shadow:0 0 10px rgba(255,207,92,.6);}
  #hud-time{position:absolute;top:46px;right:18px;font-size:12px;color:#b9b1d0;font-variant-numeric:tabular-nums;}
  #hud-level{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:14px;font-weight:700;color:rgba(255,231,190,.9);text-shadow:0 1px 6px rgba(0,0,0,.8);}
  #hud-sub{position:absolute;top:36px;left:50%;transform:translateX(-50%);font-size:10.5px;color:rgba(200,190,225,.6);letter-spacing:.1em;}
  #hud-boss{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);width:280px;display:none;}
  #hud-boss .bar{height:9px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;border:1px solid rgba(168,85,247,.4);}
  #hud-boss .fill{height:100%;width:100%;background:linear-gradient(90deg,#a855f7,#ff4d6d);transition:width .3s;}
  #hud-boss .label{font-size:10px;color:#d8c7ff;letter-spacing:.2em;text-align:center;margin-bottom:4px;}

  .mute-btn{position:absolute;top:12px;right:14px;z-index:20;width:30px;height:30px;border-radius:8px;background:rgba(10,8,18,.6);border:1px solid rgba(255,255,255,.13);color:#c9c1e0;font-size:13px;cursor:pointer;}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;background:#05040a;color:#ffcf5c;font-size:14px;letter-spacing:.2em;}
</style>
</head>
<body>
<div id="stage">
  <!-- three.js 画布会被插入这里 -->
  <div class="loading" id="loading">正在点燃火种 …</div>

  <!-- HUD -->
  <div id="hud">
    <div id="hud-hearts"></div>
    <div id="hud-stars"></div>
    <div id="hud-time">00:00</div>
    <div id="hud-level"></div>
    <div id="hud-sub"></div>
    <div id="hud-boss"><div class="label">蚀 · 影之王</div><div class="bar"><div class="fill" id="boss-fill"></div></div></div>
  </div>

  <!-- 标题 -->
  <div class="screen on" id="screen-title">
    <div class="title-han">焰行者</div>
    <div class="title-sub">迷 宫 三 境 · 3D</div>
    <div class="title-line"></div>
    <div class="title-desc">火种在迷宫深处闪烁。找到它，点亮门，走出去。</div>
    <div class="menu">
      <button class="btn" id="btn-start">开 始 冒 险</button>
      <button class="btn" id="btn-continue">继 续 征 程</button>
      <button class="btn ghost" id="btn-chars">人 物 志</button>
      <button class="btn ghost" id="btn-levels">关 卡 选 择</button>
    </div>
    <div class="tip">操作 &nbsp; <b>W A S D</b> 或 <b>方向键</b> 移动 &nbsp;·&nbsp; <b>ESC</b> 暂停 &nbsp;·&nbsp; 收集全部星火，抵达发光的门</div>
  </div>

  <!-- 人物志 -->
  <div class="screen" id="screen-chars">
    <div class="panel">
      <div class="panel-head"><h2>人 物 志</h2><span>CHARACTERS</span></div>
      <div class="char-grid" id="char-grid"></div>
      <div style="text-align:center;margin-top:18px;"><button class="btn small ghost" id="btn-chars-back">返 回</button></div>
    </div>
  </div>

  <!-- 关卡选择 -->
  <div class="screen" id="screen-levels">
    <div class="panel">
      <div class="panel-head"><h2>关 卡 选 择</h2><span>CHAPTERS</span></div>
      <div class="lv-grid" id="lv-grid"></div>
      <div style="text-align:center;margin-top:18px;"><button class="btn small ghost" id="btn-levels-back">返 回</button></div>
    </div>
  </div>

  <!-- 剧情 -->
  <div class="screen" id="screen-dialog">
    <div class="dlg-scene" id="dlg-scene">✦</div>
    <div class="dlg-box">
      <div class="dlg-name" id="dlg-name">???</div>
      <div class="dlg-text" id="dlg-text"></div>
      <div class="dlg-hint">点击继续 ▸</div>
    </div>
  </div>

  <!-- 结算 -->
  <div class="screen" id="screen-result">
    <div class="panel" style="max-width:520px;">
      <div class="res-title" id="res-title">关卡通过</div>
      <div class="res-sub" id="res-sub">CHAPTER CLEAR</div>
      <div class="res-stats" id="res-stats"></div>
      <div class="res-actions" id="res-actions"></div>
    </div>
  </div>

  <!-- 暂停 -->
  <div class="screen" id="screen-pause">
    <div class="panel" style="max-width:360px;text-align:center;">
      <div class="res-title" style="font-size:24px;">暂 停</div>
      <div class="res-sub">PAUSED</div>
      <div class="res-actions" style="flex-direction:column;align-items:stretch;">
        <button class="btn small" id="btn-resume">继 续 游 戏</button>
        <button class="btn small ghost" id="btn-restart">重 新 开 始 本 关</button>
        <button class="btn small ghost" id="btn-quit">返 回 标 题</button>
      </div>
    </div>
  </div>

  <button class="mute-btn" id="mute-btn" title="音效开关">♪</button>
</div>

<!-- three.js 通过 CDN 引入（和模板里一样的写法） -->

/* ---------- 音效 ---------- */
let audioCtx = null, muted = false, masterGain = null;
function beep(freq, dur, type, vol) {
  if (muted) return;
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain(); masterGain.gain.value = 0.5;
      masterGain.connect(audioCtx.destination);
    }
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(vol || 0.06, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(masterGain);
    o.start(); o.stop(audioCtx.currentTime + dur + 0.02);
  } catch (e) {}
}
function sfx(n) {
  if (n === 'coin') { beep(1180, .07, 'triangle', .06); setTimeout(() => beep(1580, .09, 'triangle', .05), 55); }
  else if (n === 'hurt') { beep(220, .16, 'sawtooth', .09); setTimeout(() => beep(130, .2, 'sawtooth', .07), 70); }
  else if (n === 'clear') [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .16, 'triangle', .06), i * 95));
  else if (n === 'ui') beep(680, .05, 'triangle', .04);
  else if (n === 'boss') beep(90, .4, 'sawtooth', .08);
  else if (n === 'win') [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => beep(f, .2, 'triangle', .06), i * 120));
}

/* ================================================================

/* ---------- 初始化 ---------- */
function init() {

/* ---------- 网格 <-> 世界坐标 ---------- */
function cellToWorld(c, r) { return { x: c - mapW / 2 + 0.5, z: r - mapH / 2 + 0.5 }; }
function worldToCell(x, z) { return { c: Math.floor(x + mapW / 2), r: Math.floor(z + mapH / 2) }; }
function isWall(c, r) {
  if (c < 0 || r < 0 || c >= mapW || r >= mapH) return true;
  return mapRows[r][c] === '#';
}
function hitWall(x, z) {
  const R = 0.3;
  const c0 = Math.floor(x - R + mapW / 2), c1 = Math.floor(x + R + mapW / 2);
  const r0 = Math.floor(z - R + mapH / 2), r1 = Math.floor(z + R + mapH / 2);
  for (let r = r0; r <= r1; r++)
    for (let c = c0; c <= c1; c++)
      if (isWall(c, r)) return true;
  return false;
}

/* ---------- 装载关卡 ---------- */
function clearSceneLevel() {
  if (wallGroup) { scene.remove(wallGroup); wallGroup = null; }
  stars = []; shadows = []; bullets = []; boss = null; endCube = null;
}

function loadLevel(idx) {
  clearSceneLevel();
  document.getElementById('hud-boss').style.display = 'none';   // 清掉上一关的 BOSS 血条
  const L = LEVELS[idx];
  levelIndex = idx;
  mapRows = L.map;
  mapH = mapRows.length;
  mapW = mapRows[0].length;
  levelFrames = 0;
  collected = 0;
  playerHp = playerMaxHp;
  iFrames = 0;
  gameRunning = true;
  checkpoint = null;

  // 氛围
  scene.background = new THREE.Color(L.bg);
  scene.fog = new THREE.Fog(L.fog, 7, 15);

  wallGroup = new THREE.Group();

  // 地面
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(mapW, mapH),
    new THREE.MeshLambertMaterial({ color: L.floor })
  );
  floor.rotation.x = -Math.PI / 2;
  wallGroup.add(floor);

  // 顶光带（让墙顶有一点轮廓光）
  const hemi = new THREE.HemisphereLight(L.wallTop, L.floor, 0.25);
  wallGroup.add(hemi);

  // 解析地图
  let startCell = { c: 1, r: 1 }, endCell = null, bossCell = null;
  totalStars = 0;
  for (let r = 0; r < mapH; r++) {
    for (let c = 0; c < mapW; c++) {
      const ch = mapRows[r][c];
      const w = cellToWorld(c, r);
      if (ch === '#') {
        const wall = new THREE.Mesh(
          new THREE.BoxGeometry(1, 1.35, 1),
          new THREE.MeshLambertMaterial({ color: L.wall })
        );
        wall.position.set(w.x, 0.675, w.z);
        wallGroup.add(wall);
        // 顶面描光
        const cap = new THREE.Mesh(
          new THREE.BoxGeometry(1.02, 0.06, 1.02),
          new THREE.MeshBasicMaterial({ color: L.wallTop, transparent: true, opacity: 0.5 })
        );
        cap.position.set(w.x, 1.36, w.z);
        wallGroup.add(cap);
      }
      else if (ch === 'S') startCell = { c, r };
      else if (ch === 'E') endCell = { c, r };
      else if (ch === '*') spawnStar(w.x, w.z);
      else if (ch === 'X') spawnShadow(w.x, w.z, L);
      else if (ch === 'B') bossCell = { c, r };
    }
  }

  // 玩家
  player = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.SphereGeometry(0.3, 20, 16),
    new THREE.MeshStandardMaterial({ color: 0xff8a4c, emissive: 0xff5a1c, emissiveIntensity: 0.9, roughness: 0.4 })
  );
  body.position.y = 0.32;
  player.add(body);
  const flame = new THREE.Mesh(
    new THREE.ConeGeometry(0.12, 0.34, 8),
    new THREE.MeshBasicMaterial({ color: 0xffd166 })
  );
  flame.position.y = 0.72;
  flame.name = 'flame';
  player.add(flame);
  playerLight = new THREE.PointLight(L.glow, 3.2, 8.5, 1.5);
  playerLight.position.y = 0.9;
  player.add(playerLight);
  const sw = cellToWorld(startCell.c, startCell.r);
  player.position.set(sw.x, 0, sw.z);
  checkpoint = { x: sw.x, z: sw.z };
  wallGroup.add(player);

  // 终点门
  if (endCell) {
    const w = cellToWorld(endCell.c, endCell.r);
    makeEndCube(w.x, w.z, L.glow);
  }

  // BOSS
  if (bossCell) {
    const w = cellToWorld(bossCell.c, bossCell.r);
    spawnBoss(w.x, w.z, L);
  }

  scene.add(wallGroup);

  // 相机就位
  camera.position.set(player.position.x, 8.5, player.position.z + 6);
  camera.lookAt(player.position.x, 0, player.position.z - 0.5);

  updateHUD();
  showHUD(true);
}

function makeEndCube(x, z, glow) {
  endCube = new THREE.Group();
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.42, 0.07, 12, 36),
    new THREE.MeshStandardMaterial({ color: glow, emissive: glow, emissiveIntensity: 1.2 })
  );
  ring.position.y = 0.75;

  endCube.add(ring);

  );

  endCube.add(core);
  const light = new THREE.PointLight(glow, 2, 4.5, 1.6);
  light.position.y = 0.8;
  endCube.add(light);
  endCube.position.set(x, 0, z);
  endCube.visible = true;
  wallGroup.add(endCube);
}

function spawnStar(x, z) {
  const m = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.17),
    new THREE.MeshStandardMaterial({ color: 0xffcf5c, emissive: 0xffb52c, emissiveIntensity: 1.1 })
  );
  m.position.set(x, 0.55, z);
  m.userData.baseY = 0.55;
  m.userData.phase = Math.random() * 6.28;
  wallGroup.add(m);
  stars.push(m);
  totalStars++;
}

function spawnShadow(x, z, L) {
  const g = new THREE.Group();
  const orb = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.3, 1),
    new THREE.MeshStandardMaterial({ color: 0x1a1030, emissive: 0x5b21b6, emissiveIntensity: 0.55, roughness: 0.9 })
  );
  orb.position.y = 0.42;
  g.add(orb);
  const eye = new THREE.Mesh(
    new THREE.SphereGeometry(0.09, 10, 8),
    new THREE.MeshBasicMaterial({ color: 0xff4d6d })
  );
  eye.position.set(0, 0.5, 0.26);
  eye.name = 'eye';
  g.add(eye);
  g.position.set(x, 0, z);
  g.userData = {
    dir: Math.random() < 0.5 ? 1 : -1,
    axis: Math.random() < 0.5 ? 'x' : 'z',
    homeX: x, homeZ: z,
    range: 1.6 + Math.random() * 1.2,
    t: Math.random() * 100
  };
  wallGroup.add(g);
  shadows.push(g);
}

function spawnBoss(x, z, L) {
  boss = new THREE.Group();
  const core = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.72, 2),
    new THREE.MeshStandardMaterial({ color: 0x241040, emissive: 0x7c3aed, emissiveIntensity: 0.7, roughness: 0.8 })
  );
  core.position.y = 0.95;
  core.name = 'core';
  boss.add(core);
  const halo = new THREE.Mesh(
    new THREE.TorusGeometry(1.05, 0.05, 10, 48),
    new THREE.MeshBasicMaterial({ color: 0xa855f7, transparent: true, opacity: 0.7 })
  );
  halo.position.y = 0.95;
  halo.rotation.x = Math.PI / 2;
  halo.name = 'halo';
  boss.add(halo);
  const light = new THREE.PointLight(0xa855f7, 1.8, 7, 1.6);
  light.position.y = 1.2;
  boss.add(light);
  boss.position.set(x, 0, z);
  boss.userData = { hp: 6, maxHp: 6, cd: 90, dying: 0 };
  wallGroup.add(boss);
  document.getElementById('hud-boss').style.display = 'block';
}

/* ---------- 更新 ---------- */
function update() {
  if (!gameRunning || !player) return;
  levelFrames++;
  if (iFrames > 0) iFrames--;
  if (camShake > 0) camShake *= 0.85;

  const L = LEVELS[levelIndex];

  /* 玩家移动（分轴碰撞） */
  let dx = 0, dz = 0;
  if (keys.w || keys.arrowup) dz -= 1;
  if (keys.s || keys.arrowdown) dz += 1;
  if (keys.a || keys.arrowleft) dx -= 1;
  if (keys.d || keys.arrowright) dx += 1;
  if (dx || dz) {
    const len = Math.hypot(dx, dz);
    const mx = dx / len * speed, mz = dz / len * speed;
    const nx = player.position.x + mx;
    if (!hitWall(nx, player.position.z)) player.position.x = nx;
    const nz = player.position.z + mz;
    if (!hitWall(player.position.x, nz)) player.position.z = nz;
    // 火苗朝向
    player.rotation.y = Math.atan2(mx, mz);
  }
  // 火苗摇曳
  const flame = player.getObjectByName('flame');
  if (flame) {
    flame.scale.y = 1 + Math.sin(levelFrames * 0.25) * 0.18;
    flame.rotation.y += 0.06;
  }

  /* 检查点：离危险够远时记录 */
  if (levelFrames % 24 === 0) {
    let danger = false;
    for (const s of shadows)
      if (Math.hypot(s.position.x - player.position.x, s.position.z - player.position.z) < 2.2) danger = true;
    if (boss && Math.hypot(boss.position.x - player.position.x, boss.position.z - player.position.z) < 2.8) danger = true;
    if (!danger) checkpoint = { x: player.position.x, z: player.position.z };
  }

  /* 星火 */
  for (let i = stars.length - 1; i >= 0; i--) {
    const s = stars[i];
    s.rotation.y += 0.05;
    s.position.y = s.userData.baseY + Math.sin(levelFrames * 0.06 + s.userData.phase) * 0.09;
    if (Math.hypot(s.position.x - player.position.x, s.position.z - player.position.z) < 0.5) {
      wallGroup.remove(s);
      stars.splice(i, 1);
      collected++;
      sfx('coin');
      updateHUD();
      if (boss && collected >= totalStars) killBoss();
    }
  }

  /* 巡逻暗影 */
  for (const s of shadows) {
    const u = s.userData;
    u.t += 0.03;
    const axis = u.axis, dir = u.dir;
    const nx = s.position.x + (axis === 'x' ? dir * 0.03 : 0);
    const nz = s.position.z + (axis === 'z' ? dir * 0.03 : 0);
    const homeDist = axis === 'x' ? Math.abs(nx - u.homeX) : Math.abs(nz - u.homeZ);
    if (hitWall(nx, nz) || homeDist > u.range) { u.dir *= -1; }
    else {
      s.position.x = axis === 'x' ? nx : s.position.x;
      s.position.z = axis === 'z' ? nz : s.position.z;
    }
    s.rotation.y += 0.02;
    const eye = s.getObjectByName('eye');
    if (eye) eye.lookAt(player.position.x, 0.5, player.position.z);

    // 接触判定
    if (iFrames <= 0 && Math.hypot(s.position.x - player.position.x, s.position.z - player.position.z) < 0.62) {
      damagePlayer();
    }
  }

  /* BOSS */
  if (boss && !boss.userData.dying) {
    const u = boss.userData;
    u.cd--;
    const core = boss.getObjectByName('core');
    if (core) { core.rotation.y += 0.02; core.rotation.x += 0.008; }
    const halo = boss.getObjectByName('halo');
    if (halo) halo.rotation.z += 0.015;
    if (u.cd <= 0) {
      u.cd = L.isBoss ? 80 : 100;
      // 朝玩家发射 1~3 颗暗影弹
      const n = u.hp <= 3 ? 3 : 2;
      for (let k = 0; k < n; k++) {
        const ang = Math.atan2(player.position.z - boss.position.z, player.position.x - boss.position.x) + (k - (n - 1) / 2) * 0.3;
        const b = new THREE.Mesh(
          new THREE.SphereGeometry(0.13, 10, 8),
          new THREE.MeshBasicMaterial({ color: 0xc084fc })
        );
        b.position.set(boss.position.x, 0.5, boss.position.z);
        b.userData = { vx: Math.cos(ang) * 0.055, vz: Math.sin(ang) * 0.055, life: 260 };
        wallGroup.add(b);
        bullets.push(b);
      }
      sfx('boss');
    }
    if (iFrames <= 0 && Math.hypot(boss.position.x - player.position.x, boss.position.z - player.position.z) < 1.15) {
      damagePlayer();
    }
  }

  /* 弹幕 */
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.position.x += b.userData.vx;
    b.position.z += b.userData.vz;
    b.userData.life--;
    const w = worldToCell(b.position.x, b.position.z);
    let dead = b.userData.life <= 0 || isWall(w.c, w.r);
    if (!dead && iFrames <= 0 &&
        Math.hypot(b.position.x - player.position.x, b.position.z - player.position.z) < 0.45) {
      damagePlayer();
      dead = true;
    }
    if (dead) { wallGroup.remove(b); bullets.splice(i, 1); }
  }

  /* 终点 */
  if (endCube && endCube.visible) {
    const ring = endCube.getObjectByName('ring');
    if (ring) { ring.rotation.y += 0.03; ring.rotation.x = Math.sin(levelFrames * 0.02) * 0.3; }
    if (Math.hypot(endCube.position.x - player.position.x, endCube.position.z - player.position.z) < 0.55) {
      levelClear();
    }
  }

  /* BOSS 消散动画 */
  if (boss && boss.userData.dying) {
    boss.userData.dying--;
    boss.scale.setScalar(Math.max(0.01, boss.userData.dying / 60));
    if (boss.userData.dying <= 0) {
      // 在 BOSS 原地生成终点门
      makeEndCube(boss.position.x, boss.position.z, LEVELS[levelIndex].glow);
      wallGroup.remove(boss);
      boss = null;
      document.getElementById('hud-boss').style.display = 'none';
      sfx('clear');
    }
  }

  /* 相机跟随 */
  const tx = player.position.x, tz = player.position.z;
  camera.position.x += (tx - camera.position.x) * 0.08;
  camera.position.z += (tz + 6 - camera.position.z) * 0.08;
  camera.position.y += (8.5 - camera.position.y) * 0.08;
  const shx = camShake > 0.3 ? (Math.random() - 0.5) * camShake * 0.06 : 0;
  const shz = camShake > 0.3 ? (Math.random() - 0.5) * camShake * 0.06 : 0;
  camera.position.x += shx; camera.position.z += shz;
  camera.lookAt(tx, 0, tz - 0.5);

  /* 计时 */
  if (levelFrames % 30 === 0) updateTimeHUD();
}

function damagePlayer() {
  if (iFrames > 0) return;
  playerHp--;
  iFrames = 90;
  camShake = 10;
  sfx('hurt');
  updateHUD();
  if (playerHp <= 0) { gameOver(); return; }
  // 退回检查点
  player.position.set(checkpoint.x, 0, checkpoint.z);
}

function killBoss() {
  if (!boss || boss.userData.dying) return;
  boss.userData.dying = 60;
  camShake = 14;
  sfx('win');
}

/* ---------- 渲染循环 ---------- */
function animate() {
  requestAnimationFrame(animate);
  update();
  renderer.render(scene, camera);
}

/* ---------- HUD ---------- */
function updateHUD() {
  const hearts = '❤'.repeat(Math.max(0, playerHp)) + '<span style="opacity:.22">' + '❤'.repeat(playerMaxHp - Math.max(0, playerHp)) + '</span>';
  document.getElementById('hud-hearts').innerHTML = hearts;
  document.getElementById('hud-stars').textContent = '✦ ' + collected + ' / ' + totalStars;
  const L = LEVELS[levelIndex];
  document.getElementById('hud-level').textContent = L.chapter + ' · ' + L.name;
  document.getElementById('hud-sub').textContent = L.subtitle;
  if (boss) document.getElementById('boss-fill').style.width = (boss.userData.hp / boss.userData.maxHp * 100) + '%';
}
function updateTimeHUD() {
  const s = Math.floor(levelFrames / 60);
  document.getElementById('hud-time').textContent =
    String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function showHUD(on) { document.getElementById('hud').classList.toggle('on', on); }

/* ================================================================
 *  界面流程（标题 / 对话 / 关卡 / 结算）
 * ================================================================ */
const SCREENS = ['title', 'chars', 'levels', 'dialog', 'result', 'pause'];
function showScreen(name) {
  SCREENS.forEach(s => document.getElementById('screen-' + s).classList.toggle('on', s === name));
  if (name === 'title' || name === 'chars' || name === 'levels') showHUD(false);
}
function hideAllScreens() { SCREENS.forEach(s => document.getElementById('screen-' + s).classList.remove('on')); }

const SAVE_KEY = 'flamemaze_save_v1';
let saveData = { progress: 0 };
try { const raw = localStorage.getItem(SAVE_KEY); if (raw) saveData = Object.assign(saveData, JSON.parse(raw)); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(saveData)); } catch (e) {} }

/* 对话（打字机） */
let dlg = { lines: [], idx: 0, shown: 0, typing: false, onEnd: null, timer: null };
function playDialogue(lines, onEnd) {
  dlg.lines = lines; dlg.idx = 0; dlg.onEnd = onEnd;
  state = 'dialog';
  showScreen('dialog');
  renderDlgLine();
}
function renderDlgLine() {
  const line = dlg.lines[dlg.idx];
  document.getElementById('dlg-name').textContent = line.who;
  document.getElementById('dlg-name').style.background = 'linear-gradient(180deg,' + line.color + ',' + line.color + '88)';
  document.getElementById('dlg-scene').textContent = line.emoji || '✦';
  document.querySelector('.dlg-hint').style.visibility = 'hidden';
  const el = document.getElementById('dlg-text');
  el.textContent = ''; dlg.shown = 0; dlg.typing = true;
  clearInterval(dlg.timer);
  dlg.timer = setInterval(() => {
    dlg.shown++;
    el.textContent = line.text.slice(0, dlg.shown);
    if (dlg.shown >= line.text.length) { clearInterval(dlg.timer); dlg.typing = false; document.querySelector('.dlg-hint').style.visibility = 'visible'; }
  }, 26);
}
function advanceDialogue() {
  if (dlg.typing) {
    clearInterval(dlg.timer); dlg.typing = false;
    document.getElementById('dlg-text').textContent = dlg.lines[dlg.idx].text;
    document.querySelector('.dlg-hint').style.visibility = 'visible';
    return;
  }
  dlg.idx++;
  if (dlg.idx >= dlg.lines.length) endDialogue();
  else { sfx('ui'); renderDlgLine(); }
}
function endDialogue() {
  clearInterval(dlg.timer);
  const cb = dlg.onEnd; dlg.onEnd = null;
  hideAllScreens();
  if (cb) cb();
}

/* 开始 / 通关 / 失败 */
let clearing = false;
function startLevel(idx) {
  loadLevel(idx);
  clearing = false;
  state = 'playing';
  hideAllScreens();
  sfx('ui');
}
function levelClear() {
  if (clearing || state !== 'playing') return;
  clearing = true;
  gameRunning = false;
  state = 'cleared';
  sfx('clear');
  const next = levelIndex + 1;
  if (next > saveData.progress) saveData.progress = Math.min(next, LEVELS.length - 1);
  persist();
  const isLast = levelIndex === LEVELS.length - 1;
  const sec = Math.floor(levelFrames / 60);
  showResult({
    title: isLast ? '三 境 重 燃' : '迷 宫 破 晓',
    sub: isLast ? 'THE END' : 'CHAPTER CLEAR · ' + LEVELS[levelIndex].chapter,
    stats: [
      { k: '星火', v: collected + '/' + totalStars },
      { k: '用时', v: Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0') },
      { k: '残焰', v: playerHp + '/' + playerMaxHp }
    ],
    actions: [{
      text: isLast ? '看 结 局' : '继 续', primary: true,
      onClick: () => playDialogue(DIALOGUES[LEVEL_END_STORY[levelIndex]], () => {
        if (isLast) showVictory(); else startLevel(levelIndex + 1);
      })
    }, { text: '返 回 标 题', onClick: toTitle }]
  });
}
function showVictory() {
  showResult({
    title: '全 剧 终', sub: '谢谢你陪他走完了三座迷宫',
    stats: [{ k: '关卡', v: '4/4' }, { k: '结局', v: '重燃' }, { k: '火种', v: '★' }],
    actions: [{ text: '再 走 一 遍', primary: true, onClick: () => playDialogue(DIALOGUES.intro, () => startLevel(0)) }, { text: '返 回 标 题', onClick: toTitle }]
  });
}
function gameOver() {
  gameRunning = false;
  state = 'result';
  sfx('hurt');
  const sec = Math.floor(levelFrames / 60);
  showResult({
    title: '火 种 熄 灭', lose: true,
    sub: 'GAME OVER · ' + LEVELS[levelIndex].chapter,
    stats: [
      { k: '星火', v: collected + '/' + totalStars },
      { k: '用时', v: Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0') }
    ],
    actions: [{ text: '再 试 一 次', primary: true, onClick: () => startLevel(levelIndex) }, { text: '返 回 标 题', onClick: toTitle }]
  });
}
function showResult(opt) {
  state = 'result';
  showScreen('result');
  const t = document.getElementById('res-title');
  t.textContent = opt.title;
  t.className = 'res-title' + (opt.lose ? ' lose' : '');
  document.getElementById('res-sub').textContent = opt.sub;
  document.getElementById('res-stats').innerHTML = opt.stats.map(s => '<div class="res-item"><div class="k">' + s.k + '</div><div class="v">' + s.v + '</div></div>').join('');
  const act = document.getElementById('res-actions');
  act.innerHTML = '';
  opt.actions.forEach(a => {
    const b = document.createElement('button');
    b.className = 'btn small' + (a.primary ? '' : ' ghost');
    b.textContent = a.text;
    b.addEventListener('click', () => { sfx('ui'); a.onClick(); });
    act.appendChild(b);
  });
}
function toTitle() {
  state = 'title';
  showHUD(false);
  loadLevel(Math.min(saveData.progress, LEVELS.length - 1));
  gameRunning = false;
  showScreen('title');
  refreshButtons();
}

/* 人物志 / 关卡选择 */
function buildChars() {
  document.getElementById('char-grid').innerHTML = CHARACTERS.map(c =>
    '<div class="char-card" style="border-color:' + c.color + '44">' +
    '<div class="char-avatar" style="background:linear-gradient(160deg,' + c.color + '88,' + c.color + '22)">' + c.emoji + '</div>' +
    '<div><div class="char-name" style="color:' + c.color + '">' + c.name + '<span class="char-role" style="color:' + c.color + '">' + c.role + '</span></div>' +
    '<div class="char-desc">' + c.desc + '</div><div class="char-stat">' + c.stat + '</div></div></div>').join('');
}
function buildLevels() {
  const grid = document.getElementById('lv-grid');
  grid.innerHTML = LEVELS.map((lv, i) => {
    const locked = i > saveData.progress, cleared = i < saveData.progress;
    return '<div class="lv-card ' + (locked ? 'locked' : '') + '" data-i="' + i + '">' +
      '<div class="lv-no">0' + (i + 1) + '</div><div class="lv-name">' + lv.name + '</div>' +
      '<div class="lv-sub">' + lv.chapter + '<br>' + lv.subtitle + '</div>' +
      '<div class="lv-badge">' + (locked ? '未 解 锁' : (cleared ? '已 通 关' : '可 挑 战')) + '</div></div>';
  }).join('');
  grid.querySelectorAll('.lv-card').forEach(el => {
    el.addEventListener('click', () => {
      const i = parseInt(el.dataset.i, 10);
      if (i > saveData.progress) { sfx('ui'); return; }
      startLevel(i);
    });
  });
}
function refreshButtons() {
  document.getElementById('btn-continue').disabled = saveData.progress <= 0;
}

/* 暂停 / 静音 */
function togglePause() {
  if (state === 'playing') { state = 'paused'; gameRunning = false; showScreen('pause'); }
  else if (state === 'paused') { state = 'playing'; gameRunning = true; hideAllScreens(); }
}
function toggleMute() {
  muted = !muted;
  document.getElementById('mute-btn').textContent = muted ? '✕' : '♪';
}

/* 输入 */
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k in keys) { keys[k] = true; e.preventDefault(); }
  if (e.code === 'Escape') togglePause();
  if (e.code === 'KeyM') toggleMute();
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k in keys) { keys[k] = false; e.preventDefault(); }
});
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* 按钮 */
document.getElementById('btn-start').addEventListener('click', () => { sfx('ui'); playDialogue(DIALOGUES.intro, () => startLevel(0)); });
document.getElementById('btn-continue').addEventListener('click', () => { sfx('ui'); startLevel(Math.min(saveData.progress, LEVELS.length - 1)); });
document.getElementById('btn-chars').addEventListener('click', () => { sfx('ui'); buildChars(); showScreen('chars'); });
document.getElementById('btn-levels').addEventListener('click', () => { sfx('ui'); buildLevels(); showScreen('levels'); });
document.getElementById('btn-chars-back').addEventListener('click', () => { sfx('ui'); showScreen('title'); });
document.getElementById('btn-levels-back').addEventListener('click', () => { sfx('ui'); showScreen('title'); });
document.getElementById('btn-resume').addEventListener('click', () => togglePause());
document.getElementById('btn-restart').addEventListener('click', () => startLevel(levelIndex));
document.getElementById('btn-quit').addEventListener('click', () => toTitle());
document.getElementById('mute-btn').addEventListener('click', e => { e.stopPropagation(); toggleMute(); });
document.getElementById('screen-dialog').addEventListener('click', advanceDialogue);

/* 缩放适配 */
function fit() {
  const s = Math.min(window.innerWidth * 0.97 / 960, window.innerHeight * 0.95 / 540, 1.55);
  stageEl.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', () => {
  fit();
  camera.aspect = 960 / 540;
  camera.updateProjectionMatrix();
  renderer.setSize(960, 540);
});

/* ---------- 启动（对齐模板：init(); animate();） ---------- */
buildChars();
buildLevels();
refreshButtons();
fit();
init();
loadLevel(0);
gameRunning = false;   // 标题页只展示场景，不开始
state = 'title';
showScreen('title');
document.getElementById('loading').style.display = 'none';

/* 调试入口：#play=1~4 直接进关卡 */
(function () {
  const m = (location.hash || '').match(/#play=(\d)/);
  if (m) setTimeout(() => startLevel(parseInt(m[1], 10) - 1), 100);
})();
</script>
</body>
